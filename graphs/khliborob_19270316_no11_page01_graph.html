      { selector:"edge", style:{
          "line-color":"#94a3b8","opacity":0.55,"width":2,
          "curve-style":"bezier","target-arrow-shape":"none",
      } },
      { selector:"edge.dimmed",      style:{"opacity":0.05} },
      { selector:"edge.highlighted", style:{"line-color":"#e11d48","opacity":1,"width":2.5} },
    ],
    layout:{
      name:"cose", animate:false, padding:60,
      nodeRepulsion:12000, idealEdgeLength:120, edgeElasticity:0.35,
      gravity:0.12, numIter:1000, nodeDimensionsIncludeLabels:true,
      randomize:false,
    },
    userZoomingEnabled:true, userPanningEnabled:true, boxSelectionEnabled:false,
  });

  cy.fit(cy.elements(), 60);
  document.getElementById("fitbtn").addEventListener("click", () => cy.fit(cy.elements(), 60));

  // ── search ──
  document.getElementById("search").addEventListener("input", function() {
    const q = this.value.trim().toLowerCase();
    if (!q) { cy.elements().removeClass("dimmed highlighted"); return; }
    cy.elements().addClass("dimmed");
    cy.nodes().filter(n => n.data("label").toLowerCase().includes(q))
      .removeClass("dimmed").addClass("highlighted")
      .neighborhood().removeClass("dimmed");
  });

  // ── hover ──
  cy.on("mouseover","node", function(e) {
    const hood = e.target.closedNeighborhood();
    cy.elements().not(hood).addClass("dimmed");
    hood.removeClass("dimmed");
    hood.edges().addClass("highlighted");
    e.target.addClass("highlighted");
    cy.container().style.cursor="pointer";
  });
  cy.on("mouseout","node", function() {
    cy.elements().removeClass("dimmed highlighted");
    cy.container().style.cursor="";
  });

  // ── click detail ──
  cy.on("tap","node", function(e) {
    const d = e.target.data();
    const badgeClass = "badge badge-"+d.type;
    const typeLabel  = d.type.charAt(0).toUpperCase()+d.type.slice(1);
    let body = "";

    {
      const uk = d.snippet_uk ? `<div class="snippet uk">🇺🇦 "${d.snippet_uk}"</div>` : "";
      const en = d.snippet_en ? `<div class="snippet en">🇬🇧 "${d.snippet_en}"</div>` : "";
      const conn = e.target.neighborhood("node")
        .map(n=>`<li>${n.data("label")} <span style="color:#aaa;font-size:.7rem">[${n.data("type")}]</span></li>`)
        .join("");

      let locationExtra = "";
      if (d.type==="location" && (d.lat||d.lon)) {
        const osmUrl=`https://www.openstreetmap.org/?mlat=${d.lat}&mlon=${d.lon}&zoom=8`;
        locationExtra=`<div class="field"><b>Coordinates</b><p style="font-size:.78rem">${d.lat}, ${d.lon}<br>
          <a href="${osmUrl}" target="_blank">Open in OpenStreetMap ↗</a></p></div>`;
        if (d.name_uk) locationExtra+=`<div class="field"><b>Ukrainian name</b><p style="font-size:.78rem">${d.name_uk}</p></div>`;
      }

      body = `${uk}${en}
        ${locationExtra}
        ${conn?`<div class="field"><b>Co-occurs on this page</b><ul>${conn}</ul></div>`:""}`;
    }

    document.getElementById("detail").innerHTML=`
      <h3>${d.label}</h3>
      <span class="${badgeClass}">${typeLabel}</span>
      ${body}`;
  });

  cy.on("tap", function(e) {
    if (e.target===cy) {
      cy.elements().removeClass("dimmed highlighted");
      document.getElementById("detail").innerHTML="<p class='hint'>Click any node<br>to see details.</p>";
    }
  });
  </script>
</body>
</html>
