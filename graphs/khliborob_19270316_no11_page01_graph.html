l": ""}, {"source": "Бачинський", "target": "Орлик", "label": ""}, {"source": "Бачинський", "target": "Пій XI", "label": ""}, {"source": "Бачинський", "target": "Чемберлейн", "label": ""}, {"source": "Карл", "target": "Мусоліні", "label": ""}, {"source": "Карл", "target": "Орлик", "label": ""}, {"source": "Карл", "target": "Пій XI", "label": ""}, {"source": "Карл", "target": "Чемберлейн", "label": ""}, {"source": "Мусоліні", "target": "Орлик", "label": ""}, {"source": "Мусоліні", "target": "Пій XI", "label": ""}, {"source": "Мусоліні", "target": "Чемберлейн", "label": ""}, {"source": "Орлик", "target": "Пій XI", "label": ""}, {"source": "Орлик", "target": "Чемберлейн", "label": ""}, {"source": "Пій XI", "target": "Чемберлейн", "label": ""}, {"source": "І. Мороз", "target": "А. Задорожний", "label": ""}, {"source": "І. Мороз", "target": "В. Гнатюк", "label": ""}, {"source": "І. Мороз", "target": "В. Мороз", "label": ""}, {"source": "І. Мороз", "target": "Гнат Волович", "label": ""}, {"source": "І. Мороз", "target": "Т. Мороз", "label": ""}, {"source": "А. Задорожний", "target": "В. Гнатюк", "label": ""}, {"source": "А. Задорожний", "target": "В. Мороз", "label": ""}, {"source": "А. Задорожний", "target": "Гнат Волович", "label": ""}, {"source": "А. Задорожний", "target": "Т. Мороз", "label": ""}, {"source": "В. Гнатюк", "target": "В. Мороз", "label": ""}, {"source": "В. Гнатюк", "target": "Гнат Волович", "label": ""}, {"source": "В. Гнатюк", "target": "Т. Мороз", "label": ""}, {"source": "В. Мороз", "target": "Гнат Волович", "label": ""}, {"source": "В. Мороз", "target": "Т. Мороз", "label": ""}, {"source": "Гнат Волович", "target": "Т. Мороз", "label": ""}, {"source": "І. Любачевський", "target": "С. Шаврин", "label": ""}, {"source": "Porto União", "target": "Ukraine", "label": ""}, {"source": "Porto União", "target": "В. Кухар", "label": ""}, {"source": "Ukraine", "target": "В. Кухар", "label": ""}, {"source": "А. Буряк", "target": "Гнат Волович", "label": ""}];
  function nid(x) { return typeof x==="object"?x.id:String(x); }

  // Node size: 36-68px proportional to mention count within this page.
  const maxMentions = Math.max(1, ...RAW.map(n => n.mentions||0));
  function nodeSize(n) {
    const m = n.mentions || 1;
    return Math.round(36 + (m / maxMentions) * 32);
  }

  const cy = cytoscape({
    container: document.getElementById("cy"),
    elements: [
      ...RAW.map(n => ({ data:{
          id:n.id, label:n.label, type:n.type,
          lat:n.lat||0, lon:n.lon||0, name_uk:n.name_uk||"",
          snippet_uk:n.snippet_uk||"", snippet_en:n.snippet_en||"",
          snippet_pt:n.snippet_pt||"",
          mentions:n.mentions||1, size:nodeSize(n)
      } })),
      ...EDGES.map((e,i) => ({ data:{ id:"e"+i, source:nid(e.source), target:nid(e.target),
          label:e.label||"", evidence:e.evidence||"" } }))
    ],
    style:[
      { selector:"node[type='person']", style:{
        "background-color":"#3b82f6","border-color":"#1d4ed8","border-width":2,
        "width":"data(size)","height":"data(size)",
        "label":"data(label)","color":"#1e3a5f","font-size":12,"font-weight":600,
        "text-valign":"bottom","text-halign":"center","text-margin-y":8,
        "text-background-color":"rgba(255,255,255,.85)","text-background-opacity":1,
        "text-background-padding":"2px","text-background-shape":"roundrectangle",
        "text-max-width":"150px","text-wrap":"wrap",
      } },
      { selector:"node[type='location']", style:{
        "background-color":"#10b981","border-color":"#047857","border-width":2,
        "width":"data(size)","height":"data(size)","shape":"diamond",
        "label":"data(label)","color":"#064e3b","font-size":12,"font-weight":600,
        "text-valign":"bottom","text-halign":"center","text-margin-y":12,
        "text-background-color":"rgba(255,255,255,.85)","text-background-opacity":1,
        "text-background-padding":"2px","text-background-shape":"roundrectangle",
        "text-max-width":"150px","text-wrap":"wrap",
      } },
      { selector:"node.dim",  style:{"opacity":0.15} },
      { selector:"node.hi",   style:{"border-color":"#e11d48","border-width":4} },
      { selector:"edge", style:{
        "line-color":"#94a3b8","opacity":0.55,"width":2,"curve-style":"bezier",
        "label":"data(label)","font-size":9,"color":"#6b7280",
        "text-background-color":"rgba(255,255,255,.8)","text-background-opacity":1,
        "text-background-padding":"1px","text-rotation":"autorotate",
      } },
      { selector:"edge.dim",  style:{"opacity":0.04} },
      { selector:"edge.hi",   style:{"line-color":"#e11d48","opacity":1,"width":3} },
    ],
    layout:{ name:"preset" },
    userZoomingEnabled:true, userPanningEnabled:true, boxSelectionEnabled:false,
  });

  // cose (force-directed): connected entities cluster together, driven by
  // the real co-mention edges above — not a hand-rolled row packer keyed
  // off container width, which is what used to leave labels compressed
  // and overlapping whenever a page had more than a handful of entities.
  function runLayout() {
    try {
      cy.resize();
      cy.layout({name:"cose", animate:false, randomize:true, nodeOverlap:20,
                  idealEdgeLength:()=>80, nodeRepulsion:()=>10000, gravity:30,
                  numIter:1200, fit:true, padding:60}).run();
    } catch (e) { /* container not ready yet */ }
  }
  runLayout();
  setTimeout(runLayout, 250);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      const p = cy.nodes().length ? cy.nodes()[0].position() : null;
      if (p && p.x === 0 && p.y === 0) runLayout();
    }
  });

  document.getElementById("fitbtn").onclick = () => cy.fit(cy.elements(), 60);

  document.getElementById("search").addEventListener("input", function(){
    const q = this.value.trim().toLowerCase();
    if (!q) { cy.elements().removeClass("dim hi"); return; }
    cy.elements().addClass("dim");
    cy.nodes().filter(n => n.data("label").toLowerCase().includes(q))
      .removeClass("dim").addClass("hi").neighborhood().removeClass("dim");
  });

  cy.on("mouseover","node", e => {
    const h = e.target.closedNeighborhood();
    cy.elements().not(h).addClass("dim");
    h.removeClass("dim"); h.edges().addClass("hi"); e.target.addClass("hi");
    cy.container().style.cursor="pointer";
  });
  cy.on("mouseout","node", () => {
    cy.elements().removeClass("dim hi");
    cy.container().style.cursor="";
  });

  // Which language the detail panel's snippet shows — independent of any
  // other language switcher, toggled via the buttons in #panel-lang.
  let panelLang = "en";
  let selectedNode = null;

  function renderPanel(node) {
    const d = node.data();
    const snips = {en: d.snippet_en, uk: d.snippet_uk, pt: d.snippet_pt};
    const flags = {en: "🇬🇧", uk: "🇺🇦", pt: "🇧🇷"};
    const text = snips[panelLang] || d.snippet_en || d.snippet_uk || d.snippet_pt || "";
    const snip = text ? `<div class="snip ${panelLang}">${flags[panelLang]} ${text}</div>` : "";
    const conn = node.neighborhood("node")
      .map(n=>`<li>${n.data("label")} <span style="color:#aaa;font-size:.68rem">[${n.data("type")}]</span></li>`).join("");
    let extra = "";
    if (d.type==="location" && (d.lat||d.lon)) {
      const url=`https://www.openstreetmap.org/?mlat=${d.lat}&mlon=${d.lon}&zoom=8`;
      extra = `<div class="field"><b>Map</b><a href="${url}" target="_blank">Open in OpenStreetMap ↗</a></div>`;
      if (d.name_uk) extra += `<div class="field"><b>Ukrainian</b><p style="font-size:.78rem">${d.name_uk}</p></div>`;
    }
    document.getElementById("panel-body").innerHTML = `
      <h3>${d.label}</h3>
      <span class="badge ${d.type==="person"?"bp":"bl"}">${d.type}</span>
      ${d.mentions > 1 ? `<div style="font-size:.7rem;color:#999;margin-bottom:4px">${d.mentions} mentions on this page</div>` : ""}
      ${snip}${extra}
      ${conn?`<div class="field"><b>Connected to</b><ul>${conn}</ul></div>`:""}`;
  }

  function setPanelLang(lang) {
    panelLang = lang;
    document.querySelectorAll(".plang-btn").forEach(b => b.classList.toggle("active", b.dataset.plang===lang));
    if (selectedNode) renderPanel(selectedNode);
  }

  cy.on("tap","node", e => {
    selectedNode = e.target;
    renderPanel(selectedNode);
  });
  cy.on("tap", e => {
    if (e.target===cy) {
      cy.elements().removeClass("dim hi");
      selectedNode = null;
      document.getElementById("panel-body").innerHTML="<p class='hint'>Click any node<br>to see details.</p>";
    }
  });
  </script>
