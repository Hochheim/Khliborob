  function nodeId(x) { return (x && typeof x === "object") ? x.id : String(x); }

  // Manual radial layout: page node at centre, persons left arc, locations right arc
  function radialPositions(nodes) {
    const pos = {};
    const W = window.innerWidth - 270, H = window.innerHeight - 60;
    const cx = W/2, cy = H/2;
    const persons   = nodes.filter(n => n.type==="person");
    const locations = nodes.filter(n => n.type==="location");
    const pages     = nodes.filter(n => n.type==="page");
    pages.forEach(n => { pos[n.id] = {x:cx, y:cy}; });
    // Radius grows with node count so labels never overlap
    const nMax = Math.max(persons.length, locations.length, 1);
    const r = Math.max(Math.min(W,H)*0.40, nMax * 55);
    function arc(list, startAngle, endAngle) {
      if (!list.length) return;
      // Minimum angular gap between adjacent nodes (radians → ~80px spacing on circle)
      const minGap = Math.max(0, 80 / r);
      const span   = endAngle - startAngle;
      const step   = list.length===1 ? 0 : Math.max(span/(list.length-1), minGap);
      const totalSpan = step * (list.length - 1);
      const offset = (span - totalSpan) / 2;
      list.forEach((n,i) => {
        const a = list.length===1
          ? (startAngle+endAngle)/2
          : startAngle + offset + i*step;
        pos[n.id] = {x: cx + r*Math.cos(a), y: cy + r*Math.sin(a)};
      });
    }
    arc(persons,   -Math.PI*0.95, -Math.PI*0.05);
    arc(locations,  Math.PI*0.05,  Math.PI*0.95);
    return pos;
  }

  const posBag = radialPositions(rawNodes);
  const elements = [
    ...rawNodes.map(n => ({ data:{
      id: n.id, label: n.label, type: n.type,
      lat: n.lat||0, lon: n.lon||0,
      name_uk: n.name_uk||"",
      snippet_uk: n.snippet_uk||"",
      snippet_en: n.snippet_en||"",
    }, position: posBag[n.id] || {x:400,y:300} })),
    ...rawEdges.map((e,i) => ({ data:{
      id:"e"+i, source:nodeId(e.source), target:nodeId(e.target), label:e.label
    } }))
  ];

  const cy = cytoscape({
    container: document.getElementById("cy"),
    elements,
    style: [
      { selector:"node[type='page']", style:{
          "background-color":"#f59e0b","border-color":"#b45309","border-width":2,
          "width":46,"height":46,"shape":"rectangle",
          "label":"data(label)","color":"#78350f","font-size":12,"font-weight":600,
          "text-valign":"bottom","text-halign":"center","text-margin-y":6,
          "text-background-color":"#fff","text-background-opacity":1,
          "text-background-padding":"3px","text-background-shape":"roundrectangle",
          "text-max-width":"130px","text-wrap":"ellipsis",
      } },
      { selector:"node[type='person']", style:{
          "background-color":"#3b82f6","border-color":"#1d4ed8","border-width":2,
          "width":34,"height":34,
          "label":"data(label)","color":"#1e3a5f","font-size":13,"font-weight":600,
          "text-valign":"bottom","text-halign":"center","text-margin-y":6,
          "text-background-color":"#fff","text-background-opacity":1,
          "text-background-padding":"3px","text-background-shape":"roundrectangle",
          "text-max-width":"150px","text-wrap":"ellipsis",
      } },
      { selector:"node[type='location']", style:{
          "background-color":"#10b981","border-color":"#065f46","border-width":2,
          "width":34,"height":34,
          "label":"data(label)","color":"#064e3b","font-size":13,"font-weight":600,
          "text-valign":"bottom","text-halign":"center","text-margin-y":6,
          "text-background-color":"#fff","text-background-opacity":1,
          "text-background-padding":"3px","text-background-shape":"roundrectangle",
          "text-max-width":"150px","text-wrap":"ellipsis",
      } },
      { selector:"node:selected", style:{"border-color":"#e11d48","border-width":4,"overlay-opacity":0} },
      { selector:"node.dimmed",   style:{"opacity":0.12} },
      { selector:"node.highlighted", style:{"border-color":"#e11d48","border-width":3} },
      { selector:"edge", style:{
          "line-color":"#cbd5e1","opacity":0.7,"width":1.5,
          "curve-style":"straight","target-arrow-shape":"none",
      } },
      { selector:"edge.dimmed",      style:{"opacity":0.04} },
      { selector:"edge.highlighted", style:{"line-color":"#e11d48","opacity":1,"width":2.5} },
    ],
    layout:{ name:"preset" },
    userZoomingEnabled:true, userPanningEnabled:true, boxSelectionEnabled:false,
  });

  // ── search ──
  document.getElementById("search").addEventListener("input", function() {
    const q = this.value.trim().toLowerCase();
    if (!q) { cy.elements().removeClass("dimmed highlighted"); return; }
    cy.elements().addClass("dimmed");
    cy.nodes().filter(n => n.data("label").toLowerCase().includes(q))
      .removeClass("dimmed").addClass("highlighted")
      .neighborhood().removeClass("dimmed");
  });

  // ── hover ──
  cy.on("mouseover","node", function(e) {
    const hood = e.target.closedNeighborhood();
    cy.elements().not(hood).addClass("dimmed");
    hood.removeClass("dimmed");
    hood.edges().addClass("highlighted");
    e.target.addClass("highlighted");
    cy.container().style.cursor="pointer";
  });
  cy.on("mouseout","node", function() {
    cy.elements().removeClass("dimmed highlighted");
    cy.container().style.cursor="";
  });

  // ── click detail ──
  cy.on("tap","node", function(e) {
    const d = e.target.data();
    const badgeClass = "badge badge-"+d.type;
    const typeLabel  = d.type==="page"?"Issue":d.type.charAt(0).toUpperCase()+d.type.slice(1);
    let body = "";

    if (d.type==="page") {
      const ents = e.target.neighborhood("node")
        .map(n=>`<li>${n.data("label")} <span style="color:#aaa;font-size:.7rem">[${n.data("type")}]</span></li>`)
        .join("");
      body = `<div class="field"><b>Publication</b><p style="font-size:.8rem">1928-09-26 · No. V. 30. (207)</p></div>
              <div class="field"><b>Entities on this page</b><ul>${ents||"<li>—</li>"}</ul></div>`;
    } else {
      const uk = d.snippet_uk ? `<div class="snippet uk">🇺🇦 "${d.snippet_uk}"</div>` : "";
      const en = d.snippet_en ? `<div class="snippet en">🇬🇧 "${d.snippet_en}"</div>` : "";
      const conn = e.target.neighborhood("node")
        .filter(n=>n.data("type")!=="page")
        .map(n=>`<li>${n.data("label")}</li>`).join("");

      let locationExtra = "";
      if (d.type==="location" && (d.lat||d.lon)) {
        const osmUrl=`https://www.openstreetmap.org/?mlat=${d.lat}&mlon=${d.lon}&zoom=8`;
        locationExtra=`<div class="field"><b>Coordinates</b><p style="font-size:.78rem">${d.lat}, ${d.lon}<br>
          <a href="${osmUrl}" target="_blank">Open in OpenStreetMap ↗</a></p></div>`;
        if (d.name_uk) locationExtra+=`<div class="field"><b>Ukrainian name</b><p style="font-size:.78rem">${d.name_uk}</p></div>`;
      }

      body = `${uk}${en}
        ${locationExtra}
        ${conn?`<div class="field"><b>Co-occurs with</b><ul>${conn}</ul></div>`:""}`;
    }

    document.getElementById("detail").innerHTML=`
      <h3>${d.label}</h3>
      <span class="${badgeClass}">${typeLabel}</span>
      ${body}`;
  });

  cy.on("tap", function(e) {
    if (e.target===cy) {
      cy.elements().removeClass("dimmed highlighted");
      document.getElementById("detail").innerHTML="<p class='hint'>Click any node<br>to see details.</p>";
    }
  });
  </script>
</body>
</html>
