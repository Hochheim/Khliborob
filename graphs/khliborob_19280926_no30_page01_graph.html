    function nodeId(x) { return (x && typeof x === "object") ? x.id : String(x); }

    const elements = [
      ...rawNodes.map(n => ({ data: { id: n.id, label: n.label, type: n.type,

      ...rawEdges.map((e,i) => ({ data: { id:"e"+i,
                                            source: nodeId(e.source),
                                            target: nodeId(e.target),
                                            label: e.label } }))
    ];

    const cy = cytoscape({
      container: document.getElementById("cy"),
      elements,
      style: [
        { selector: "node[type='page']",
           style: { "background-color":"#e94560","border-color":"#fff","border-width":2,

                  gravity:0.25, numIter:500 },
      userZoomingEnabled: true,
      userPanningEnabled: true,
      boxSelectionEnabled: false,
    });

    // Dismiss overlay on first interaction to give Cytoscape focus
    document.getElementById("overlay").addEventListener("click", function() {
      this.style.display = "none";
      cy.resize();
      cy.fit();
    });

    cy.on("tap", "node", function(e) {
      const d = e.target.data();

      let extra = "";
      if (d.type === "page") {
        extra = `<div class="field"><b>Publication</b>1928-09-26</div>
                 <div class="field"><b>Issue</b>V. 30. (207)</div>`;
      } else if (d.type === "location" && (d.lat || d.lon)) {
        const url = `https://www.openstreetmap.org/?mlat=${d.lat}&mlon=${d.lon}&zoom=10`;
        extra = `<div class="field"><b>Ukrainian name</b>${d.name_uk||"—"}</div>
                 <div class="field"><b>Coordinates</b>${d.lat}, ${d.lon}</div>
                 <div class="field"><a href="${url}" target="_blank">Open in OpenStreetMap ↗</a></div>`;
      }

      const snippet = (d.snippet_uk || d.snippet_en) ? `
        ${d.snippet_uk ? `<div class="snippet"><b style="color:#888;font-size:0.7rem">🇺🇦 UK</b><br>"${d.snippet_uk}"</div>` : ""}
        ${d.snippet_en ? `<div class="snippet" style="margin-top:4px"><b style="color:#888;font-size:0.7rem">🇬🇧 EN</b><br>"${d.snippet_en}"</div>` : ""}
      ` : "";

      const conn = e.target.neighborhood("node").map(n => `<li>${n.data("label")}</li>`).join("");
      document.getElementById("detail").innerHTML = `
        <h3>${d.label}</h3>
        <span class="badge">${d.type}</span>
        ${extra}
        ${snippet}
        <div class="field"><b>Connected to</b><ul>${conn||"<li>—</li>"}</ul></div>`;
    });

    cy.on("tap", function(e) {
      if (e.target === cy) {
        document.getElementById("detail").innerHTML =
          "<p class='hint'>Click any node to see details.</p>";
      }
    });
  </script>
