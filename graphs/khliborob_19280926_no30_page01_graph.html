    cy.container().style.cursor="pointer";
  });
  cy.on("mouseout","node", () => {
    cy.elements().removeClass("dim hi");
    cy.container().style.cursor="";
  });


    var SNIP_FLAGS = {en: "🇬🇧", uk: "🇺🇦", pt: "🇧🇷", de: "🇩🇪"};
    var SNIP_FALLBACK_ORDER = ["en", "uk", "pt", "de"];
    function pickSnippetLang(snips, preferredLang) {
      if (snips[preferredLang]) return preferredLang;
      for (var i = 0; i < SNIP_FALLBACK_ORDER.length; i++) {
        if (snips[SNIP_FALLBACK_ORDER[i]]) return SNIP_FALLBACK_ORDER[i];
      }
      return null;
    }
    function snippetDiv(snips, preferredLang) {
      var lang = pickSnippetLang(snips, preferredLang);
      if (!lang) return "";
      return '<div class="snip ' + lang + '">' + SNIP_FLAGS[lang] + ' "' + snips[lang] + '"</div>';
    }
    

  // Which language the detail panel's snippet shows — toggled via the
  // buttons in #panel-lang, and (like the location map) reads/writes the
  // same 'lang' localStorage key the main site uses, so it starts in sync
  // with the issue page instead of always defaulting to English.
  let panelLang = (function() { try { return localStorage.getItem('lang') || 'en'; } catch(e) { return 'en'; } })();
  let selectedNode = null;

  function renderPanel(node) {
    const d = node.data();
    const snips = {en: d.snippet_en, uk: d.snippet_uk, pt: d.snippet_pt, de: d.snippet_de};
    // A snippet in the requested language isn't always found (e.g. a
    // location's name isn't stored per-language, so searching for it in a
    // translation it doesn't literally contain can come up empty) — fall
    // back to whichever language does have one, but always label the
    // fallback honestly rather than showing e.g. English text under a
    // German flag just because German was requested first.
    const shownLang = pickSnippetLang(snips, panelLang) || panelLang;
    const snip = snippetDiv(snips, panelLang);
    // Links to whichever language the snippet above actually ended up
    // showing (not necessarily panelLang, per the fallback above) — not
    // always the Ukrainian original — so what you land on matches what
    // you just read.
    const srcLink = d.paraIdx !== null && d.paraIdx !== undefined
      ? `<a class="src-link" href="${ISSUE_URL}#para-${shownLang}-${PAGE_ID}-${d.paraIdx}" target="_blank">↗ View paragraph in transcript</a>`
      : "";
    const conn = node.neighborhood("node")
      .map(n=>`<li>${n.data("label")} <span style="color:#aaa;font-size:.68rem">[${n.data("type")}]</span></li>`).join("");
    let extra = "";
    if (d.type==="location" && (d.lat||d.lon)) {
      const url=`https://www.openstreetmap.org/?mlat=${d.lat}&mlon=${d.lon}&zoom=8`;
      extra = `<div class="field"><b>Map</b><a href="${url}" target="_blank">Open in OpenStreetMap ↗</a></div>`;
      if (d.name_uk) extra += `<div class="field"><b>Ukrainian</b><p style="font-size:.78rem">${d.name_uk}</p></div>`;
    }
    // Most organizations here (a tannery, a single bakery, a shoemaking
    // workshop) simply have no Wikidata entry — the box is omitted rather
    // than shown empty. When it exists, the description is Wikidata's own
    // sourced one-liner, not written up by hand.
    const aboutLink = d.wikipedia_url || d.wikidata_url;
    const about = d.wikidata_description
      ? `<details class="about-box"><summary>About</summary>
           <p>${d.wikidata_description}</p>
           ${aboutLink ? `<a href="${aboutLink}" target="_blank">${d.wikipedia_url?"Wikipedia ↗":"Wikidata ↗"}</a>` : ""}
         </details>`
      : "";
    document.getElementById("panel-body").innerHTML = `
      <h3>${d.label}</h3>
      <span class="badge ${d.type==="person"?"bp":d.type==="organization"?"bo":"bl"}">${d.type}</span>
      ${about}
      ${d.mentions > 1 ? `<div style="font-size:.7rem;color:#999;margin-bottom:4px">${d.mentions} mentions on this page</div>` : ""}
      ${snip}${srcLink}${extra}
      ${conn?`<div class="field"><b>Connected to</b><ul>${conn}</ul></div>`:""}`;
  }

  // The topbar/legend/hint chrome around the graph was previously always
  // English regardless of the language buttons, which only ever touched
  // the side panel — fixed alongside the node-label fix above by reusing
  // the same buttons to drive this UI text too.
  const UI_STRINGS = {
    en: { sub: "Nodes = entities on this page · Edges = mentioned near each other · Click for details",
           search: "Search…", issueLink: "↗ Open issue page", fit: "⊡ Fit",
           person: "Person", location: "Location", org: "Organization",
           edge: "— mentioned near each other on this page",
           hint: "Click any node<br>to see details." },
    uk: { sub: "Вузли = сутності на цій сторінці · Ребра = згадані поруч · Натисніть для деталей",
           search: "Пошук…", issueLink: "↗ Відкрити сторінку випуску", fit: "⊡ За розміром",
           person: "Особа", location: "Місце", org: "Організація",
           edge: "— згадані поруч на цій сторінці",
           hint: "Натисніть на будь-який вузол,<br>щоб побачити деталі." },
    pt: { sub: "Nós = entidades nesta página · Arestas = mencionadas próximas uma da outra · Clique para detalhes",
           search: "Pesquisar…", issueLink: "↗ Abrir página da edição", fit: "⊡ Ajustar",
           person: "Pessoa", location: "Local", org: "Organização",
           edge: "— mencionadas próximas uma da outra nesta página",
           hint: "Clique em qualquer nó<br>para ver detalhes." },
    de: { sub: "Knoten = Entitäten auf dieser Seite · Kanten = in der Nähe zueinander erwähnt · Für Details klicken",
           search: "Suche…", issueLink: "↗ Ausgabenseite öffnen", fit: "⊡ Einpassen",
           person: "Person", location: "Ort", org: "Organisation",
           edge: "— auf dieser Seite in der Nähe zueinander erwähnt",
           hint: "Klicken Sie auf einen Knoten,<br>um Details zu sehen." },
  };

  function applyUiLang(lang) {
    const t = UI_STRINGS[lang] || UI_STRINGS.en;
    document.getElementById("topbar-sub").textContent = t.sub;
    document.getElementById("search").placeholder = t.search;
    document.getElementById("issue-link").textContent = t.issueLink;
    document.getElementById("fitbtn").textContent = t.fit;
    document.getElementById("legend-person").textContent = t.person;
    document.getElementById("legend-location").textContent = t.location;
    document.getElementById("legend-org").textContent = t.org;
    document.getElementById("legend-edge").textContent = t.edge;
    if (!selectedNode) document.getElementById("panel-hint").innerHTML = t.hint;
  }

  function setPanelLang(lang) {
    panelLang = lang;
    document.querySelectorAll(".plang-btn").forEach(b => b.classList.toggle("active", b.dataset.plang===lang));
    applyUiLang(lang);
    // Previously this only re-rendered the side panel — the graph's own node
    // labels were baked in once at build time and never changed, so toggling
    // language visibly did nothing to the graph itself. Each node carries a
    // label_en/label_uk/label_pt/label_de set at build time (PT/DE fall back
    // to the English name, since no distinct translation is ever extracted
    // for a proper noun); switch the live "label" field cytoscape actually
    // renders to match.
    cy.nodes().forEach(n => n.data("label", n.data("label_" + lang) || n.data("label_en")));
    if (selectedNode) renderPanel(selectedNode);
  }

  cy.on("tap","node", e => {
    selectedNode = e.target;
    renderPanel(selectedNode);
  });
  cy.on("tap", e => {
    if (e.target===cy) {
      cy.elements().removeClass("dim hi");
      selectedNode = null;
      document.getElementById("panel-body").innerHTML =
        `<p class="hint" id="panel-hint">${(UI_STRINGS[panelLang] || UI_STRINGS.en).hint}</p>`;
    }
  });

  setPanelLang(panelLang);

  // Embedded as a small iframe preview on the issue page (as opposed to
  // opened standalone via the "expand" link) — the preview should just
  // silently follow the issue page's own language rather than exposing a
  // second, redundant language switcher in miniature. Initial language
  // already matches (same-origin iframe shares localStorage with its
  // parent, applied via panelLang's initializer above), so this only
  // needs to keep following if the reader changes language on the parent
  // page AFTER the graph has already loaded.
  if (window.self !== window.top) {
    var plangEl = document.getElementById('panel-lang');
    if (plangEl) plangEl.style.display = 'none';
    try {
      window.parent.document.addEventListener('langchange', function(e) {
        setPanelLang(e.detail.lang);
      });
    } catch (e) {}
  }
  </script>
</body>
</html>
