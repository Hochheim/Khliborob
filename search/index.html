<div id="search-results" style="padding-top:1.5rem">
  <div style="max-width:560px;margin-bottom:1.5rem">
    <div class="search-box">
      <input type="search" id="q" data-i18n="search_placeholder"
             placeholder="Search all pages" />
      <button onclick="doSearch()" data-i18n="search_btn">Search</button>
    </div>
  </div>
  <div id="results"></div>
</div>
<script>
// Pagefind's module does not expose a `window.pagefind` global on its own —
// it must be dynamically imported and initialized. This previously checked
// `window.pagefind` directly, which was always undefined, so every search
// silently fell through to "index not built" regardless of whether the
// index existed. Dynamic import() works from a plain script, so no separate
// type="module" tag is needed.
window.pagefindReady = (async () => {
  try {
    // Pagefind derives its own basePath from this module's resolved URL
    // (import.meta.url), so a relative dynamic import is enough for it to
    // find its index and produce correctly-prefixed result URLs even when
    // the site is deployed under a subpath like hochheim.github.io/Khliborob/.
    // Do not pass an explicit basePath override here — it expects the path
    // to the pagefind/ directory itself, not the site root, and got it
    // wrong when guessed from the page URL instead of left to auto-detect.
    const pf = await import('../pagefind/pagefind.js');
    await pf.init();
    return pf;
  } catch (e) {
    console.warn('Pagefind unavailable:', e);
    return null;
  }
})();

async function doSearch() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  // Relative, not "/search/?q=..." — an absolute path breaks under the
  // GitHub Pages subpath (hochheim.github.io/Khliborob/), sending the
  // address bar to the wrong URL.
  window.history.replaceState({}, '', location.pathname + '?q=' + encodeURIComponent(q));
  document.getElementById('results').innerHTML = '<p style="font-size:13px;color:var(--muted)">Searching…</p>';
  const pf = await window.pagefindReady;
  if (!pf) {
    document.getElementById('results').innerHTML =
      '<p style="font-size:13px;color:var(--muted)">Full-text search index is unavailable right now. ' +
      'Try the <a href="../chat/">Research Agent</a> instead, or browse by year.</p>';
    return;
  }
  const search = await pf.search(q);
  if (!search.results.length) {
    document.getElementById('results').innerHTML =
      '<p style="font-size:13px;color:var(--muted)">No results found.</p>';
    return;
  }
  const data = await Promise.all(search.results.slice(0, 20).map(x => x.data()));
  document.getElementById('results').innerHTML = data.map(d => `
    <div class="result-card">
      <div class="result-date">${d.meta?.date||''} ${d.meta?.issue||''}</div>
      <div class="result-title"><a href="${d.url}">${d.meta?.title||d.url}</a></div>
      <div class="result-snippet">${d.excerpt}</div>
    </div>`).join('');
}
const params = new URLSearchParams(window.location.search);
const q = params.get('q');
if (q) { document.getElementById('q').value = q; doSearch(); }
document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});
</script>
