00e3o culpemos a todos e a tudo, mas, introduzindo contas, controlando receitas e despesas para n\u00f3s mesmos e para a propriedade, talvez percebamos que somos muito, muito\u2026", "de": "Lasst uns nicht \u00fcber schwere Zeiten und Umst\u00e4nde klagen, lasst uns nicht alle und alles beschuldigen, sondern indem wir Buchf\u00fchrung einf\u00fchren, Einnahmen und Ausgaben f\u00fcr uns selbst und den Haushalt kontrollieren, werden \u2026"}}, {"label": "1927-03-16 No.\u2116 11 (139)", "page_id": "khliborob_19270316_no11_page03", "para_idx": 38, "issue_url": "https://hochheim.github.io/Khliborob/issues/khliborob_19270316_no11/", "snippets": {"uk": "\u2026\u0445\u043e\u0447\u0443\u0442\u044c \u043f\u0435\u0440\u0435\u0434\u043f\u043b\u0430\u0442\u0438\u0442\u0438 \u201e\u0423\u043a\u0440. \u0425\u043b\u0456\u0431.\u201c \u0449\u043e\u0431\u0438 \u0437 \u043d\u044c\u043e\u0433\u043e \u0432\u0447\u0438\u0442\u0438\u0441\u044f \u0440\u043e\u0437\u0443\u043c\u043d\u043e\u0433\u043e \u0436\u0438\u0442\u0442\u044f, \u0442\u043e \u043d\u0435\u0445\u0430\u0439 \u0457\u0445 \u0432\u0447\u0438\u0442\u044c \u201e\u0406\u0432\u0430\u043d\u043e\u0432\u0430 \u0425\u0430\u0442\u0430\u201c \u0456 \u0441\u0430\u043b\u0434\u0430\u0442\u0438.  ", "en": "They don't want to learn from their own, from the local teacher Sokhotsky, they don't want to subscribe to \"Ukr. Khlib.\" to learn a sensible life from it, so let \"Ivanova Khata\" and the soldiers teach them.", "pt": "Eles n\u00e3o querem aprender com os seus, com o professor local Sokhotsky, n\u00e3o querem assinar o \"Ukr. Khlib.\" para aprender uma vida sensata com ele, ent\u00e3o que a \"Ivanova Khata\" e os soldados os ensinem.", "de": "Sie wollen nicht von den Ihren lernen, vom hiesigen Lehrer Sochotsky, sie wollen \u201eUkr. Khlib.\u201c nicht abonnieren, um daraus ein vern\u00fcnftiges Leben zu lernen, dann sollen sie von der \u201eIvanova Khata\u201c und den Soldaten lernen\u2026"}}], "name_uk": "\u0406\u0432\u0430\u043d\u043e\u0432\u0430 \u0425\u0430\u0442\u0430", "is_region": false, "wikidata": ""}, "issues": [{"label": "1927-03-16 No.\u2116 11 (139)", "page_id": "khliborob_19270316_no11_page03", "para_idx": 12, "issue_url": "https://hochheim.github.io/Khliborob/issues/khliborob_19270316_no11/", "snippets": {"uk": "\u041f\u0440\u043e\u0434\u0430\u0454\u0442\u044c\u0441\u044f \u0446\u0456\u043b\u043a\u043e\u043c \u043d\u043e\u0432\u0430 \u0445\u0430\u0442\u0430, \u043f\u043e\u043b\u043e\u0436\u0435\u043d\u0430 \u0432 \u0443\u043a\u0440\u0430\u0457\u043d\u0441\u044c\u043a\u0456\u0439 \u0434\u0456\u043b\u044c\u043d\u0438\u0446\u0456 \u043c\u0456\u0441\u0442\u0435\u0447\u043a\u0430 \u041c. \u041c\u0430\u043b\u0454\u0442 (\u043f\u0440\u043e\u0442\u0438 \u0448\u043a\u043e\u043b\u0438 \u0421.\u0421. \u0456 \u0431\u043b\u0438\u0437\u044c\u043a\u043e \u043d\u043e\u0432\u043e\u0457 \u0443\u043a\u0440\u0430\u0457\u043d\u0441\u044c\u043a\u043e\u0457 \u0446\u0435\u0440\u043a\u0432\u0438, \u044f\u043a\u0430 \u043d\u0435\u0437\u0430\u0434\u043e\u0432\u0433\u043e \u043f\u043e\u0447\u043d\u0435 \u0431\u0443\u0434\u0443\u0432\u0430\u0442\u0438\u0441\u044f)", "en": "A brand new house is for sale, located in the Ukrainian district of the town of M. Mallet (opposite S.S. school and near the new Ukrainian church, which will soon begin construction).", "pt": "Vende-se uma casa nov\u00edssima, localizada no bairro ucraniano da cidade de M. Mallet (em frente \u00e0 escola S.S. e perto da nova igreja ucraniana, que em breve come\u00e7ar\u00e1 a ser constru\u00edda).", "de": "Ein brandneues Haus steht zum Verkauf, gelegen im ukrainischen Viertel der Stadt M. Mallet (gegen\u00fcber der S.S.-Schule und in der N\u00e4he der neuen ukrainischen Kirche, deren Bau bald beginnen wird)."}}]}, {"ul": {"name": "Ukraine", "lat": 48.3794, "lon": 31.1656, "issues": [{"label": "1927-03-16 No.\u2116 11 (139)", "page_id": "khliborob_19270316_no11_page01", "para_idx": 2, "issue_url": "https://hochheim.github.io/Khliborob/issues/khliborob_19270316_no11/", "snippets": {"uk": "\u0423\u041a\u0420\u0410\u0407\u041d\u0421\u042c\u041a\u0418\u0419 \u0425\u041b\u0406\u0411\u041e\u0420\u041e\u0411  \u0414\u043e\u0431\u0443\u0442\u0438, \u0430\u0431\u043e \u0434\u043e\u043c\u0430 \u043d\u0435 \u0431\u0443\u0442\u0438  ", "en": "THE UKRAINIAN CULTIVATOR", "pt": "O CULTIVADOR UCRANIANO", "de": "DER UKRAINISCHE ACKERBAUER"}}, {"label": "1927-03-16 No.\u2116 11 (139)", "page_id": "khliborob_19270316_no11_page02", "para_idx": 2, "issue_url": "https://hochheim.github.io/Khliborob/issues/khliborob_19270316_no11/", "snippets": {"uk": "\u0412\u0441\u0456\u043c \u0454 \u0432 \u043f\u0430\u043c\u044f\u0442\u0438 \u043e\u0440\u0491\u0430\u043d\u0456\u0437\u0430\u0446\u0456\u044f \u201e\u0417\u043e\u0440\u0456\u201c \u043e\u0440\u0491\u0430\u043d\u0456\u0437\u0430\u0446\u0456\u044f \u201e\u041d\u0430\u0440\u043e\u0434\u043d\u043e\u0457 \u0420\u0430\u0434\u0438\u201c \u0437 \u201e\u0423\u043a\u0440\u0430\u0457\u043d\u043e\u044e\u201c, \u0432\u0441\u0456\u043c \u0454 \u0432 \u043f\u0430\u043c\u044f\u0442\u0438 \u043d\u0435 \u043b\u0438\u0448\u0435 \u0440\u043e\u0437\u0446\u0432\u0456\u0442, \u0430 \u0439 \u0457\u0445\u043d\u0456\u0439 \u043a\u0456\u043d\u0435\u0446\u044c, \u0456 \u0442\u043e\u043c\u0443 \u0431\u0430\u0433\u0430\u0442\u043e \u043b\u044e\u0434\u0435\u0439 \u0434\u0443\u043c\u0430\u043b\u043e, \u0449\u043e \u0437 \u0423\u043a\u0440\u0430\u0457\u043d\u0441\u044c\u043a\u0438\u043c \u0421\u043e\u044e\u2026", "en": "Everyone remembers the organization \"Zorya\", the organization \"Narodna Rada\" with \"Ukraina\"; everyone remembers not only their flourishing but also their end, and therefore many people thought that with the Ukrainian Uni\u2026", "pt": "Todos se lembram da organiza\u00e7\u00e3o \"Zorya\", da organiza\u00e7\u00e3o \"Narodna Rada\" com \"Ukraina\"; todos se lembram n\u00e3o apenas do seu florescimento, mas tamb\u00e9m do seu fim, e por isso muitas pessoas pensaram que com a Uni\u00e3o Ucraniana,\u2026", "de": "Jeder erinnert sich an die Organisation \u201eZorya\u201c, die Organisation \u201eNarodna Rada\u201c mit \u201eUkraina\u201c; jeder erinnert sich nicht nur an ihre Bl\u00fctezeit, sondern auch an ihr Ende, und deshalb dachten viele Leute, dass mit der Ukr\u2026"}}, {"label": "1927-03-16 No.\u2116 11 (139)", "page_id": "khliborob_19270316_no11_page03", "para_idx": 1, "issue_url": "https://hochheim.github.io/Khliborob/issues/khliborob_19270316_no11/", "snippets": {"uk": "\u041d\u0430 \u0432\u0441\u044f\u043a\u0456 \u0443\u0457\u0434\u0430\u043d\u043d\u044f \u201e\u041f\u0440\u0430\u0446\u0456\u201c \u0443\u043a\u0440\u0430\u0457\u043d\u0446\u0456 \u043d\u0435 \u043f\u043e\u0432\u0438\u043d\u043d\u0456 \u0437\u0432\u0430\u0436\u0430\u0442\u0438. \u041d\u0435 \u0434\u0438\u0432\u043d\u043e, \u0432\u0441\u044f\u043a\u0456 \u201e\u0432\u0456\u0434\u043f\u0430\u0434\u043a\u0438\u201c \u0432\u0456\u0434 \u0443\u043a\u0440\u0430\u0457\u043d\u0441\u0442\u0432\u0430 \u043c\u0443\u0441\u044f\u0442\u044c \u043c\u0430\u0442\u0438 \u0441\u0432\u043e\u0454 \u043f\u0440\u0438\u0431\u0456\u0436\u0438\u0449\u0435. \u201e\u042f\u043a\u0438\u0439 \u043f\u0430\u043d, \u2026", "en": "Ukrainians should not pay attention to any attacks from \"Pratsia\". It's no wonder that all \"apostates\" from Ukrainianism must have their refuge. \"Like master, like man\" - as the folk proverb says.", "pt": "Os ucranianos n\u00e3o devem dar aten\u00e7\u00e3o a quaisquer ataques do \"Pratsia\". N\u00e3o \u00e9 de admirar que todos os \"renegados\" do ucranianismo devam ter o seu ref\u00fagio. \"Tal amo, tal criado\" - como diz o prov\u00e9rbio popular.", "de": "Die Ukrainer sollten keine Angriffe von \u201ePratsia\u201c beachten. Es ist kein Wunder, dass alle \u201eAbtr\u00fcnnigen\u201c vom Ukrainertum ihren Zufluchtsort haben m\u00fcssen. \u201eWie der Herr, so der Knecht\u201c \u2013 wie das Sprichwort sagt."}}, {"label": "1927-03-16 No.\u2116 11 (139)", "page_id": "khliborob_19270316 var arcLines = [];
var pinned = null;   // {name, side} of the currently pinned city, or null
var mapLang = 'uk';
// Set by whichever click handler most recently opened a popup, so
// setMapLang() can refresh it in place — a standalone L.popup() (as
// used here, not layer.bindPopup()) has no _source to fetch this from.
var currentPopupRebuild = null;

function setMapLang(lang){
  mapLang = lang;
  document.querySelectorAll('.mlang-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.mlang===lang);
  });
  // Re-render whatever popup is currently open so the switch is visible
  // immediately rather than only on the next click.
  if (map._popup && map._popup.isOpen() && currentPopupRebuild) {
    map._popup.setContent(currentPopupRebuild());
  }
}

function issueListHtml(issueList){
  var fallbackOrder = ['uk','en','pt','de'];
  return (issueList||[]).map(function(x){
    // x.snippets is the actual mention text (the paragraph itself, or —
    // for an arc's shared entries — the article both places were
    // co-mentioned in) in all four languages, not the issue's overall
    // abstract, which said nothing about the mention itself. A snippet
    // in the requested language isn't always found (e.g. no literal
    // match in that translation) — fall back to whichever language does
    // have one, but label/link it honestly rather than showing e.g.
    // English text under a page linked as if it were German.
    var snips = x.snippets || {};
    var shownLang = snips[mapLang] ? mapLang : fallbackOrder.find(function(l){ return snips[l]; }) || mapLang;
    var text = snips[shownLang] || '';
    var anchor = (x.para_idx !== undefined && x.para_idx !== null) ? ('#para-'+shownLang+'-'+x.page_id+'-'+x.para_idx) : '';
    var url = (x.issue_url||'') + anchor;
    return '<div style="margin-top:6px"><a href="'+url+'" target="_blank" '
      + 'style="color:#FFD500;font-weight:600;text-decoration:underline">'+x.label+' ↗</a>'
      + (text ? '<br><span style="color:#444;font-size:11px;line-height:1.4;font-style:italic">"'+text+'"</span>' : '')
      + '</div>';
  }).join('');
}

// Shared by each arc's own click handler and the "Connected to" list in
// makeMarker's popup below — a marker-side way to open a specific arc's
// info reliably, since arcs sharing an endpoint can visually overlap
// into what looks like one line (see the comment on the fan-out spread
// further down): clicking a bundle of overlapping lines can land on any
// one of several different arcs depending on the exact pixel, which
// isn't a fixable click target no matter how much they're spread out.
// Listing connections directly in the marker popup sidesteps needing to
// click a line at all.
function arcPopHtml(arc){
  var ul=arc.ul, bl=arc.bl;
  var ulLabel = ul.wikidata ? '<a href="'+ul.wikidata+'" target="_blank" style="color:#7dd3fc">'+ul.name+' ↗</a>' : ul.name;
  var blLabel = bl.wikidata ? '<a href="'+bl.wikidata+'" target="_blank" style="color:#7dd3fc">'+bl.name+' ↗</a>' : bl.name;
  return '<strong style="font-size:13px">'+ulLabel+' &harr; '+blLabel+'</strong><br>'
    + '<small style="color:#aaa;font-size:11px">Connected via '+(arc.issues||[]).length+' issue(s):</small>'
    + issueListHtml(arc.issues);
}

arcs.forEach(function(arc, idx){
  var ul=arc.ul, bl=arc.bl;
  var latlngs=[];
  // Alternate arcs above/below the straight path with varying magnitudes
  // so parallel arcs spread into a fan rather than stacking exactly.
  var sign   = (idx % 2 === 0) ? 1 : -1;
  var spread = sign * (8 + Math.floor(idx / 2) * 2.5);
  var midLat = (ul.lat+bl.lat)/2 + 18 + sign * (idx % 5);
  var midLon = (ul.lon+bl.lon)/2 + spread;
  for(var t=0;t<=1;t+=0.04){
    latlngs.push([
      (1-t)*(1-t)*ul.lat + 2*(1-t)*t*midLat + t*t*bl.lat,
      (1-t)*(1-t)*ul.lon + 2*(1-t)*t*midLon + t*t*bl.lon
    ]);
  }

  // Rebuilt on each open (not cached once) so it reflects whichever
  // language is currently selected via setMapLang().
  function buildPopHtml(){ return arcPopHtml(arc); }

  var cnt = (arc.issues||[]).length;
  // Thicker baseline (was 1-5px) so a visible/highlighted arc is an
  // easier click target, not just easier to see.
  var weight = Math.min(3 + cnt, 8);

  // Hidden by default (opacity 0) — every arc drawn at once was unreadable
  // clutter. Arcs only become visible for whichever city is hovered/pinned.
  var line = L.polyline(latlngs,{
    color:'#FFD500', weight:weight, opacity:0
  }).addTo(map);

  arcLines.push({line:line, ulName:ul.name, blName:bl.name, buildPopHtml:buildPopHtml, weight:weight});

  line.on('click', function(e){
    L.DomEvent.stopPropagation(e);
    currentPopupRebuild = buildPopHtml;
    L.popup({maxWidth:320,maxHeight:280}).setLatLng(e.latlng).setContent(buildPopHtml()).openOn(map);
  });
});

function showConnections(name, side){
  arcLines.forEach(function(a){
    var keep = side==='ul' ? a.ulName===name : a.blName===name;
    a.line.setStyle(keep
      ? {color:'#FFD500', weight:a.weight+2, opacity:0.85}
      : {opacity:0});
  });
}
function hideAllArcs(){
  arcLines.forEach(function(a){ a.line.setStyle({opacity:0}); });
}
function unpin(){
  pinned = null;
  currentPopupRebuild = null;
  hideAllArcs();
  map.closePopup();
}
map.on('click', function(){ unpin(); });

// Opens a specific arc's popup directly by its index in `arcs` (a plain
// integer needs no escaping in the onclick string, unlike a place name
// that might contain a quote) — used by the "Connected to" list in a
// marker's popup, since clicking the rendered line itself is unreliable
// whenever several arcs share an endpoint and their curves overlap.
function openArcPopupByIndex(i, lat, lon){
  var arc = arcs[i];
  if (!arc) return;
  currentPopupRebuild = function(){ return arcPopHtml(arc); };
  L.popup({maxWidth:320,maxHeight:280}).setLatLng([lat,lon]).setContent(arcPopHtml(arc)).openOn(map);
}

function makeMarker(loc, color, side){
  var wikiLink = loc.wikidata
    ? '<a href="'+loc.wikidata+'" target="_blank" style="color:#7dd3fc">Wikidata ↗</a><br>' : '';
  // No boundary-polygon data exists for any region in this corpus (that
  // would need a separate geocoding step — fetching real shapes from
  // OSM/Nominatim, not guaranteed to exist cleanly for a broad concept
  // like "the Americas" as a whole continent). Until that exists, a
  // region gets a bigger, dashed, differently-colored marker and an
  // explicit label instead of looking like an exact, precisely-placed
  // city — the same "approximate centroid" convention already used on
  // the other location maps.
  var regionNote = loc.is_region
    ? '<br><small style="color:#f39c12">⚠️ Broad region — marker is an approximate centroid, not an exact place.</small>' : '';
  // Lists every arc touching this marker as its own clickable item,
  // rather than relying on the rendered line itself as the click target
  // — arcs sharing an endpoint can fan out so tightly their curves
  // overlap, so a click on "the line" can land on any one of several
  // different arcs depending on the exact pixel. This is a reliable way
  // to reach a specific connection regardless of how the lines overlap.
  function connectionsHtml(){
    var items = [];
    arcs.forEach(function(a, i){
      var isMatch = side==='ul' ? a.ul.name===loc.name : a.bl.name===loc.name;
      if (!isMatch) return;
      var other = side==='ul' ? a.bl : a.ul;
      items.push('<li style="margin:3px 0"><a href="javascript:void(0)" '
        + 'onclick="openArcPopupByIndex('+i+','+loc.lat+','+loc.lon+')" '
        + 'style="color:#FFD500;text-decoration:none">↔ '+other.name+'</a></li>');
    });
    if (!items.length) return '';
    return '<div style="margin-top:8px"><small style="color:#aaa;font-size:11px">Connected to ('+items.length+'):</small>'
      + '<ul style="list-style:none;padding-left:0;margin:4px 0 0">'+items.join('')+'</ul></div>';
  }
  // Rebuilt on each open (not cached once) so it reflects whichever
  // language is currently selected via setMapLang().
  function buildPopHtml(){
    return '<strong style="font-size:13px">'+loc.name+(loc.is_region?' <span style="color:#f39c12">(region)</span>':'')+'</strong><br>'
      + wikiLink
      + '<small style="color:#aaa;font-size:11px">Mentioned in '+(loc.issues||[]).length+' issue(s):</small>'
      + issueListHtml(loc.issues) + connectionsHtml() + regionNote;
  }
  var m = loc.is_region
    ? L.circleMarker([loc.lat,loc.lon],{
        radius:11,color:'#f39c12',fillColor:color,fillOpacity:.55,weight:3,dashArray:'4,3'
      }).addTo(map)
    : L.circleMarker([loc.lat,loc.lon],{
        radius:6,color:color,fillColor:color,fillOpacity:.9,weight:2
      }).addTo(map);
  m.bindTooltip('<b>'+loc.name+'</b>'+(loc.is_region?' <span style="color:#f39c12">(region)</span>':'')+'<br><small>Click to see connections</small>',
    {permanent:false,direction:'top',offset:[0,-8]});
  m.on('mouseover', function(){ if(!pinned) showConnections(loc.name, side); });
  m.on('mouseout', function(){ if(!pinned) hideAllArcs(); });
  m.on('click', function(e){
    L.DomEvent.stopPropagation(e);
    if (pinned && pinned.name===loc.name && pinned.side===side) {
      unpin();
    } else {
      pinned = {name:loc.name, side:side};
      showConnections(loc.name, side);
      currentPopupRebuild = buildPopHtml;
      L.popup({maxWidth:300,maxHeight:280}).setLatLng(e.latlng).setContent(buildPopHtml()).openOn(map);
    }
  });
  return m;
}

var seenUl={}, seenBl={};
arcs.forEach(function(arc){
  if(!seenUl[arc.ul.name]){ makeMarker(arc.ul,'#005BBB','ul'); seenUl[arc.ul.name]=1; }
  if(!seenBl[arc.bl.name]){ makeMarker(arc.bl,'#22c55e','bl'); seenBl[arc.bl.name]=1; }
});
</script></body></html>
