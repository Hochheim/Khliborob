<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>1981 — Knowledge Graph</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:#1a1a2e; font-family:sans-serif; color:#eee;
            display:flex; flex-direction:column; height:100vh; overflow:hidden; }
    #header { background:#16213e; padding:10px 16px; border-bottom:1px solid #0f3460;
               flex-shrink:0; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
    #header h2 { font-size:0.95rem; margin:0; }
    #header p  { font-size:0.75rem; opacity:0.6; margin:0; }
    #filter-bar { display:flex; align-items:center; gap:10px; font-size:0.78rem;
                   background:#0f3460; padding:5px 12px; border-radius:5px; margin-left:auto; }
    #filter-bar label { white-space:nowrap; }
    #min-mentions { width:120px; accent-color:#e94560; }
    #node-count { font-size:0.75rem; opacity:0.7; white-space:nowrap; }
    #main { display:flex; flex:1; overflow:hidden; }
    #cy { flex:1; }
    #detail { width:230px; background:#16213e; border-left:1px solid #0f3460;
               padding:12px; font-size:0.8rem; overflow-y:auto; flex-shrink:0; }
    #detail h3 { font-size:0.88rem; color:#e94560; margin-bottom:6px; }
    #detail .badge { display:inline-block; background:#0f3460; border-radius:3px;
                      padding:1px 6px; font-size:0.7rem; margin-bottom:8px; }
    #detail .field { margin-bottom:8px; }
    #detail .field b { display:block; color:#888; font-size:0.72rem; margin-bottom:2px; }
    #detail a { color:#e94560; }
    #detail ul { padding-left:14px; }
    #detail li { font-size:0.76rem; padding:1px 0; }
    #detail .hint { color:#444; font-size:0.75rem; margin-top:16px; }
    #legend { position:fixed; bottom:10px; left:10px; background:#16213e;
               padding:6px 10px; border-radius:5px; font-size:0.72rem; }
    #legend span { display:inline-block; width:9px; height:9px;
                    border-radius:50%; margin-right:4px; vertical-align:middle; }
  </style>
</head>
<body>
  <div id="header">
    <div>
      <h2>🧠 1981 — Knowledge Graph</h2>
      <p>1 issue(s) &nbsp;·&nbsp; Scroll to zoom · Drag to pan · Click node for details</p>
    </div>
    <div id="filter-bar">
      <label for="min-mentions">Min. page mentions:</label>
      <input type="range" id="min-mentions" min="1" max="1" value="1" step="1"/>
      <span id="filter-val">1</span>
      <span id="node-count"></span>
    </div>
  </div>
  <div id="main">
    <div id="cy"></div>
    <div id="detail"><p class="hint">Click any node to see details.</p></div>
  </div>
  <div id="legend">
    <span style="background:#e94560"></span>Page &nbsp;
    <span style="background:#4a90d9"></span>Person &nbsp;
    <span style="background:#7c53b8"></span>Location
  </div>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
  <script>
    if (window.self !== window.top) {
      document.body.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;
                    justify-content:center;height:100vh;background:#1a1a2e;
                    color:#eee;font-family:sans-serif;gap:20px;padding:20px;text-align:center;">
          <p style="font-size:1rem;opacity:0.7;margin:0">
            The Knowledge Graph must be opened in its own tab to be interactive.
          </p>
          <a href="${window.location.href}" target="_blank"
             style="background:#e94560;color:#fff;padding:14px 32px;
                    border-radius:6px;text-decoration:none;font-size:1rem;font-weight:bold;">
            🧠 Open Knowledge Graph ↗
          </a>
        </div>`;
    }

    const rawNodes = [{"id": "bukovina_19811201_no4", "type": "page", "label": "bukovina_19811201_no4", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Bukovyna", "type": "location", "label": "Bukovyna", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Ukraine", "type": "location", "label": "Ukraine", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Romania", "type": "location", "label": "Romania", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "USSR", "type": "location", "label": "USSR", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Toronto", "type": "location", "label": "Toronto", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Danube River", "type": "location", "label": "Danube River", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Dobruja", "type": "location", "label": "Dobruja", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Tulcea", "type": "location", "label": "Tulcea", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Northern Bukovina", "type": "location", "label": "Northern Bukovina", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Southern Bukovina", "type": "location", "label": "Southern Bukovina", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Rădăuți", "type": "location", "label": "Rădăuți", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Suceava", "type": "location", "label": "Suceava", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Moldova", "type": "location", "label": "Moldova", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Cacica", "type": "location", "label": "Cacica", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Maramureș", "type": "location", "label": "Maramureș", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Sighetu Marmației", "type": "location", "label": "Sighetu Marmației", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Tiachiv", "type": "location", "label": "Tiachiv", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Banat", "type": "location", "label": "Banat", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Chernivtsi", "type": "location", "label": "Chernivtsi", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Bucharest", "type": "location", "label": "Bucharest", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Lviv", "type": "location", "label": "Lviv", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Germany", "type": "location", "label": "Germany", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Eastern Europe", "type": "location", "label": "Eastern Europe", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Galicia", "type": "location", "label": "Galicia", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Galicia-Volhynia Kingdom", "type": "location", "label": "Galicia-Volhynia Kingdom", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Poland", "type": "location", "label": "Poland", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Russia", "type": "location", "label": "Russia", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Berlin", "type": "location", "label": "Berlin", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Western Ukrainian People's Republic", "type": "location", "label": "Western Ukrainian People's Republic", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Dniester River", "type": "location", "label": "Dniester River", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Southern Bug River", "type": "location", "label": "Southern Bug River", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Odesa", "type": "location", "label": "Odesa", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Moscow", "type": "location", "label": "Moscow", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Cluj-Napoca", "type": "location", "label": "Cluj-Napoca", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Siberia", "type": "location", "label": "Siberia", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Oleksander Kovalsky", "type": "person", "label": "Oleksander Kovalsky", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "U. Karop", "type": "person", "label": "U. Karop", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Ivan", "type": "person", "label": "Ivan", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Vanka", "type": "person", "label": "Vanka", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Yana", "type": "person", "label": "Yana", "pages": [], "snippets_uk": {}, "snippets_en": {}}, {"id": "Yanek", "type": "person", "label": "Yanek", "pages": [], "snippets_uk": {}, "snippets_en": {}}];
    const rawEdges = [{"source": "bukovina_19811201_no4", "target": "Bukovyna", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Ukraine", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Romania", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "USSR", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Toronto", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Danube River", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Dobruja", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Tulcea", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Northern Bukovina", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Southern Bukovina", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Rădăuți", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Suceava", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Moldova", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Cacica", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Maramureș", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Sighetu Marmației", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Tiachiv", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Banat", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Chernivtsi", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Bucharest", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Lviv", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Germany", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Eastern Europe", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Galicia", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Galicia-Volhynia Kingdom", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Poland", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Russia", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Berlin", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Western Ukrainian People's Republic", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Dniester River", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Southern Bug River", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Odesa", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Moscow", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Cluj-Napoca", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Siberia", "label": "LOCATED IN"}, {"source": "bukovina_19811201_no4", "target": "Oleksander Kovalsky", "label": "MENTIONS"}, {"source": "bukovina_19811201_no4", "target": "U. Karop", "label": "MENTIONS"}, {"source": "bukovina_19811201_no4", "target": "Ivan", "label": "MENTIONS"}, {"source": "bukovina_19811201_no4", "target": "Vanka", "label": "MENTIONS"}, {"source": "bukovina_19811201_no4", "target": "Yana", "label": "MENTIONS"}, {"source": "bukovina_19811201_no4", "target": "Yanek", "label": "MENTIONS"}];

    function nodeId(x) { return (x && typeof x === "object") ? x.id : String(x); }

    // Pre-compute page mention count per node id
    const pageIds = new Set(rawNodes.filter(n => n.type === "page").map(n => n.id));
    const mentionCount = {};
    rawEdges.forEach(e => {
      const src = nodeId(e.source), tgt = nodeId(e.target);
      if (pageIds.has(src)) mentionCount[tgt] = (mentionCount[tgt]||0) + 1;
      if (pageIds.has(tgt)) mentionCount[src] = (mentionCount[src]||0) + 1;
    });

    function buildElements(minMentions) {
      const visibleNodeIds = new Set(
        rawNodes
          .filter(n => n.type === "page" || (mentionCount[n.id]||0) >= minMentions)
          .map(n => n.id)
      );
      const nodes = rawNodes
        .filter(n => visibleNodeIds.has(n.id))
        .map(n => ({ data: { id: n.id, label: n.label, type: n.type,
                               pages: (n.pages||[]).join(", "),
                               omeka_url: n.omeka_url||"",
                               mentions: mentionCount[n.id]||0,
                               snippets_uk: JSON.stringify(n.snippets_uk||{}),
                               snippets_en: JSON.stringify(n.snippets_en||{}),
                               omeka_urls: JSON.stringify(n.omeka_urls||{}) } }));
      const edges = rawEdges
        .filter(e => visibleNodeIds.has(nodeId(e.source)) && visibleNodeIds.has(nodeId(e.target)))
        .map((e,i) => ({ data: { id:"e"+i,
                                   source: nodeId(e.source),
                                   target: nodeId(e.target),
                                   label: e.label } }));
      return [...nodes, ...edges];
    }

    function updateCount(min) {
      const visible = rawNodes.filter(n => n.type !== "page" && (mentionCount[n.id]||0) >= min).length;
      document.getElementById("node-count").textContent =
        `(${visible} entities visible)`;
    }

    const cy = cytoscape({
      container: document.getElementById("cy"),
      elements: buildElements(1),
      style: [
        { selector: "node[type='page']",
           style: { "background-color":"#e94560","border-color":"#fff","border-width":2,
                     "width":28,"height":28,"label":"data(label)",
                     "color":"#eee","font-size":10,"text-valign":"bottom","text-margin-y":4 } },
        { selector: "node[type='person']",
           style: { "background-color":"#4a90d9","border-color":"#e94560","border-width":1.5,
                     "width":18,"height":18,"label":"data(label)",
                     "color":"#eee","font-size":8,"text-valign":"bottom","text-margin-y":3 } },
        { selector: "node[type='location']",
           style: { "background-color":"#7c53b8","border-color":"#e94560","border-width":1.5,
                     "width":18,"height":18,"label":"data(label)",
                     "color":"#eee","font-size":8,"text-valign":"bottom","text-margin-y":3 } },
        { selector: "node:selected",
           style: { "border-color":"#fff","border-width":3,"overlay-opacity":0.15 } },
        { selector: "edge",
           style: { "line-color":"#444","opacity":0.6,"width":1.2,
                     "curve-style":"bezier","target-arrow-shape":"none" } },
      ],
      layout: { name:"cose", animate:false, padding:40,
                  nodeRepulsion:6000, idealEdgeLength:100,
                  gravity:0.2, numIter:500 },
      userZoomingEnabled: true,
      userPanningEnabled: true,
      boxSelectionEnabled: false,
    });

    // Initialise count display
    updateCount(1);

    // Slider: filter nodes by minimum page-mention count
    const slider = document.getElementById("min-mentions");
    slider.addEventListener("input", function() {
      const min = parseInt(this.value);
      document.getElementById("filter-val").textContent = min;
      updateCount(min);
      cy.elements().remove();
      cy.add(buildElements(min));
      cy.layout({ name:"cose", animate:true, animationDuration:400,
                   padding:40, nodeRepulsion:6000,
                   idealEdgeLength:100, gravity:0.2, numIter:300 }).run();
      document.getElementById("detail").innerHTML =
        "<p class='hint'>Click any node to see details.</p>";
    });

    cy.on("tap", "node", function(e) {
      const d   = e.target.data();
      let body = "";
      // Format a raw page_id into a readable citation
      // e.g. bukovina_19811201_no4_page01 → "Bukovina, 1 December 1981, No. 4, Page 1"
      function formatPageId(pid) {
        var months = ["","January","February","March","April","May","June",
                      "July","August","September","October","November","December"];
        var m = pid.match(/([a-z]+)_([0-9][0-9][0-9][0-9])([0-9][0-9])([0-9][0-9])_([^_]+)_page([0-9]+)/i);
        if (!m) return pid;
        var paper = m[1].charAt(0).toUpperCase() + m[1].slice(1);
        var mon   = months[parseInt(m[3], 10)] || m[3];
        var issue = m[5].replace(/^no/i, "No. ").replace(/^ch/i, "Ch. ");
        return paper + ", " + parseInt(m[4], 10) + " " + mon + " " + m[2] + ", " + issue + ", Page " + parseInt(m[6], 10);
      }

      if (d.type === "page") {
        const entities = e.target.neighborhood("node")
          .map(n => `<li>${n.data("label")} <span style="color:#888;font-size:0.7rem">[${n.data("type")}]</span></li>`)
          .join("");
        body = `<div class="field"><b>Entities mentioned</b>
                  <ul>${entities || "<li>—</li>"}</ul></div>`;
      } else {
        const snUk = JSON.parse(d.snippets_uk || "{}");
        const snEn = JSON.parse(d.snippets_en || "{}");
        const pages = d.pages ? d.pages.split(", ") : [];

        const omUrls = JSON.parse(d.omeka_urls || "{}");
        const pageItems = pages.map(p => {
          const url  = omUrls[p] || "";
          const cite = formatPageId(p);
          const link = url
            ? `<a href="${url}" target="_blank"
                  style="color:#e94560;text-decoration:none;font-size:0.78rem">
                ${cite} ↗</a>`
            : `<b style="font-size:0.78rem">${cite}</b>`;
          const uk = snUk[p] ? `<div style="background:#0a0a1a;border-left:3px solid #e94560;
                                  padding:5px 8px;margin:4px 0;font-size:0.74rem;
                                  font-style:italic;color:#bbb">🇺🇦 "${snUk[p]}"</div>` : "";
          const en = snEn[p] ? `<div style="background:#0a0a1a;border-left:3px solid #4a90d9;
                                  padding:5px 8px;margin:4px 0;font-size:0.74rem;
                                  font-style:italic;color:#bbb">🇬🇧 "${snEn[p]}"</div>` : "";
          return `<li style="margin-bottom:10px;list-style:none">
                    ${link}${uk}${en}
                  </li>`;
        }).join("") || "<li>—</li>";

        body = `<div class="field"><b>Cited in</b><ul style="padding:0">${pageItems}</ul></div>`;
      }
      document.getElementById("detail").innerHTML = `
        <h3>${d.label}</h3>
        <span class="badge">${d.type}</span>
        ${body}`;
    });

    cy.on("tap", function(e) {
      if (e.target === cy) {
        document.getElementById("detail").innerHTML =
          "<p class='hint'>Click any node to see details.</p>";
      }
    });
  </script>
</body>
</html>
