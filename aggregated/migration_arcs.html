    this.setStyle({color:'#fff',weight:weight+1.5,opacity:1});
    setTimeout(function(){ line.setStyle({color:'#FFD500',weight:weight,opacity:0.55}); }, 2000);
    L.popup({maxWidth:300}).setLatLng(e.latlng).setContent(popHtml).openOn(map);
  });
});

function dimAllExcept(keepNames, side){
  arcLines.forEach(function(a){
    var keep = side==='ul' ? keepNames.has(a.ulName) : keepNames.has(a.blName);
    a.line.setStyle(keep
      ? {color:'#fff',  weight:a.weight+1, opacity:1}
      : {color:'#555',  weight:1,          opacity:0.18});
  });
}
function restoreAll(){
  arcLines.forEach(function(a){
    a.line.setStyle({color:'#FFD500', weight:a.weight, opacity:0.55});
  });
}

function makeMarker(loc, color, side){
  var issueLinks = (loc.issues||[]).map(function(x){
    return '<a href=”'+x.url+'” target=”_blank” style=”color:#FFD500;font-weight:600;text-decoration:underline”>'+x.label+'</a>';
  }).join('<br>');
  var popHtml = '<strong style=”font-size:13px”>'+loc.name+'</strong>'
    + (issueLinks ? '<br><small style=”color:#aaa;font-size:11px”>Click issue to open:</small><br>'+issueLinks : '');
  var m = L.circleMarker([loc.lat,loc.lon],{
    radius:6,color:color,fillColor:color,fillOpacity:.9,weight:2
  }).addTo(map);
  m.bindTooltip('<b>'+loc.name+'</b><br><small>Hover to highlight connections</small>',
    {permanent:false,direction:'top',offset:[0,-8]});
  m.bindPopup(popHtml,{maxWidth:260});
  m.on('mouseover', function(){ dimAllExcept(new Set([loc.name]), side); });
  m.on('mouseout',  function(){ restoreAll(); });
  return m;
}

var seenUl={}, seenBl={};
arcs.forEach(function(arc){
  if(!seenUl[arc.ul.name]){ makeMarker(arc.ul,'#005BBB','ul'); seenUl[arc.ul.name]=1; }
  if(!seenBl[arc.bl.name]){ makeMarker(arc.bl,'#e63946','bl'); seenBl[arc.bl.name]=1; }
});
</script></body></html>
