var openTip = null;

arcs.forEach(function(arc){
  var ul=arc.ul, bl=arc.bl;
  var latlngs=[];
  var midLat=(ul.lat+bl.lat)/2+18, midLon=(ul.lon+bl.lon)/2;
  for(var t=0;t<=1;t+=0.04){
    latlngs.push([
      (1-t)*(1-t)*ul.lat + 2*(1-t)*t*midLat + t*t*bl.lat,
      (1-t)*(1-t)*ul.lon + 2*(1-t)*t*midLon + t*t*bl.lon
    ]);
  }

  // Build popup HTML
  var issueLinks = (arc.issues||[]).map(function(x){
    return '<a href="'+x.url+'" target="_blank">'+x.label+'</a>';
  }).join(' &nbsp; ');
  var popHtml = '<strong>'+ul.name+' ↔ '+bl.name+'</strong>'
    + (issueLinks ? '<br><small style="color:#aaa">Mentioned in:</small><br>'+issueLinks : '');

  var line = L.polyline(latlngs,{
    color: arc.shared ? '#FFD500' : '#aaa',
    weight: arc.shared ? 2 : 1.2,
    opacity: arc.shared ? 0.75 : 0.45
  }).addTo(map);

  line.on('mouseover', function(e){
    this.setStyle({color:'#fff',weight:3,opacity:1});
    openTip = L.popup({closeButton:false,offset:[0,-5],maxWidth:280})
      .setLatLng(e.latlng).setContent(popHtml).openOn(map);
  });
  line.on('mouseout', function(){
    this.setStyle({color: arc.shared?'#FFD500':'#aaa', weight:arc.shared?2:1.2, opacity:arc.shared?.75:.45});
    map.closePopup();
  });
  line.on('click', function(e){
    L.popup({maxWidth:280}).setLatLng(e.latlng).setContent(popHtml).openOn(map);
  });
});

// Location markers — show on hover
function makeMarker(loc, color){
  var issueLinks = (loc.issues||[]).map(function(x){
    return '<a href="'+x.url+'" target="_blank">'+x.label+'</a>';
  }).join(' &nbsp; ');
  var popHtml = '<strong>'+loc.name+'</strong>'
    + (issueLinks ? '<br><small style="color:#aaa">Mentioned in:</small><br>'+issueLinks : '');
  var m = L.circleMarker([loc.lat,loc.lon],{radius:5,color:color,fillColor:color,fillOpacity:.9,weight:1.5}).addTo(map);
  m.bindTooltip(loc.name, {permanent:false,direction:'top',offset:[0,-6]});
  m.bindPopup(popHtml,{maxWidth:240});
  return m;
}

// Deduplicate and render markers
var seenUl={}, seenBl={};
arcs.forEach(function(arc){
  if(!seenUl[arc.ul.name]){ makeMarker(arc.ul,'#005BBB'); seenUl[arc.ul.name]=1; }
  if(!seenBl[arc.bl.name]){ makeMarker(arc.bl,'#e63946'); seenBl[arc.bl.name]=1; }
});
