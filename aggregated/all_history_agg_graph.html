<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Full Archive — Knowledge Graph</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#f5f4f0;font-family:'Segoe UI',system-ui,sans-serif;color:#1a1a1a;
         display:flex;flex-direction:column;height:100vh;overflow:hidden}

    /* ── top bar ── */
    #topbar{background:#fff;border-bottom:1px solid #ddd;padding:8px 14px;flex-shrink:0;
             display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(0,0,0,.08)}
    #topbar h2{font-size:.9rem;font-weight:700;color:#1a1a1a;white-space:nowrap}
    #topbar .sub{font-size:.72rem;color:#888;white-space:nowrap}
    #search{flex:1;min-width:140px;max-width:200px;border:1px solid #ccc;border-radius:6px;
             padding:4px 9px;font-size:.8rem;outline:none}
    #search:focus{border-color:#2b6cb0;box-shadow:0 0 0 2px rgba(43,108,176,.2)}
    .ctrl{display:flex;align-items:center;gap:6px;font-size:.76rem;color:#555;white-space:nowrap}
    .ctrl label{color:#555}
    #min-mentions{width:100px;accent-color:#2b6cb0}
    #node-count{font-size:.72rem;color:#888}
    #toggle-pages{font-size:.76rem;padding:3px 10px;border:1px solid #ccc;border-radius:5px;
                   cursor:pointer;background:#fff;color:#333}
    #toggle-pages.active{background:#2b6cb0;color:#fff;border-color:#2b6cb0}

    /* ── main area ── */
    #main{display:flex;flex:1;overflow:hidden;flex-direction:row}
    #cy{position:absolute;inset:0;background:#f5f4f0}

    /* ── detail panel ── */
    #detail{width:260px;background:#fff;border-left:1px solid #e0e0e0;
             padding:14px;font-size:.8rem;overflow-y:auto;flex-shrink:0;
             box-shadow:-2px 0 6px rgba(0,0,0,.04)}
    #detail h3{font-size:.95rem;font-weight:700;color:#1a1a1a;margin-bottom:4px;line-height:1.3}
    #detail .badge{display:inline-block;border-radius:99px;padding:2px 10px;
                    font-size:.68rem;font-weight:600;text-transform:uppercase;
                    letter-spacing:.04em;margin-bottom:10px}
    .badge-person{background:#dbeafe;color:#1e40af}
    .badge-location{background:#d1fae5;color:#065f46}
    .badge-page{background:#fef3c7;color:#92400e}
    #detail .field{margin-bottom:10px}
    #detail .field b{display:block;font-size:.68rem;text-transform:uppercase;
                      letter-spacing:.05em;color:#aaa;margin-bottom:4px}
    #detail a{color:#2b6cb0;text-decoration:none}
    #detail a:hover{text-decoration:underline}
    #detail ul{list-style:none;padding:0}
    #detail li{padding:4px 0;border-bottom:1px solid #f0f0f0;font-size:.78rem}
    #detail li:last-child{border-bottom:none}
    .snippet{background:#f8f8f8;border-left:3px solid #ccc;padding:8px 12px;
              margin-top:4px;font-size:1rem;font-style:italic;color:#444;
              border-radius:0 4px 4px 0;line-height:1.6}
    .snippet.uk{border-color:#2b6cb0}
    .snippet.en{border-color:#059669}
    #detail .hint{color:#bbb;font-size:.78rem;margin-top:20px;line-height:1.6;text-align:center}

    /* ── legend ── */
    #legend{position:absolute;bottom:12px;left:12px;background:rgba(255,255,255,.92);
             padding:7px 12px;border-radius:8px;font-size:.72rem;color:#444;
             border:1px solid #e0e0e0;backdrop-filter:blur(4px);display:flex;gap:14px}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;
          margin-right:4px;vertical-align:middle}

    /* ── loading overlay ── */
    #loading{position:absolute;inset:0;background:#f5f4f0;display:flex;
              align-items:center;justify-content:center;font-size:.85rem;
              color:#888;z-index:10;pointer-events:none}
  </style>
</head>
<body>
  <div id="topbar">
    <div>
      <h2>🧠 Full Archive — Knowledge Graph</h2>
      <span class="sub">2 total issues &nbsp;·&nbsp; Scroll to zoom · Drag to pan · Click for details</span>
    </div>
    <input id="search" type="search" placeholder="Search person or place…" autocomplete="off"/>
    <div class="ctrl">
      <label for="min-mentions">Min. mentions</label>
      <input type="range" id="min-mentions" min="0" max="2" value="0" step="1"/>
      <span id="filter-val">1</span>
      <span id="node-count"></span>
    </div>
    <button id="toggle-pages">Show issue nodes</button>
  </div>
  <div id="main">
    <div id="cy-wrap" style="position:relative;flex:1;overflow:hidden">
      <div id="cy"></div>
      <div id="loading">Building graph…</div>
      <div id="legend">
        <span><span class="dot" style="background:#3b82f6"></span>Person</span>
        <span><span class="dot" style="background:#10b981"></span>Location</span>
        <span><span class="dot" style="background:#f59e0b" id="legend-page"></span>Issue</span>
      </div>
    </div>
    <div id="detail"><p class="hint">Click any node<br>to see details.</p></div>
  </div>

_no30", "target": "Lviv", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Poland", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Tukhlya", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Przemyśl", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Tukholshchyna", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Muscovy", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Doryzoni", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Rome", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Nicaea", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Southern Germany", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Canada", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Kitsman", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Bukovyna", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Bessarabia", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Trento", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Europe", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Baltic Sea", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Sea of Azov", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Kronstadt", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Gulf of Finland", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Leningrad", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Curitiba", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Stanislaviv (Ivano-Frankivsk)", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Hryby (Lviv Oblast)", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Paraná", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Vitória (Brazil)", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Rio Grande (Brazil)", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Antônio Cândido (Paraná, Brazil)", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Dorizon (Ponta Grossa, Brazil)", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Ponta Grossa", "label": "LOCATED IN"}, {"source": "khliborob_19280926_no30", "target": "Argentina", "label": "LOCATED IN"}];

  function nodeId(x) { return (x && typeof x === "object") ? x.id : String(x); }

  // ── mention counts ──
  const pageIds = new Set(rawNodes.filter(n => n.type === "page").map(n => n.id));
  const hasPageNodes = rawNodes.some(n => n.type === "page");
  const mentionCount = {};
  rawEdges.forEach(e => {
    const s = nodeId(e.source), t = nodeId(e.target);
    if (pageIds.has(s)) mentionCount[t] = (mentionCount[t]||0)+1;
    if (pageIds.has(t)) mentionCount[s] = (mentionCount[s]||0)+1;
  });

  // ── co-occurrence edges: only pairs that share 2+ pages ──
  // Counting ALL co-occurrences per page produces a near-complete graph
  // (N entities → N*(N-1)/2 edges), making the map unreadable.
  // We keep only pairs that are co-mentioned across at least 2 separate pages.
  const pageToEntities = {};
  rawEdges.forEach(e => {
    const s = nodeId(e.source), t = nodeId(e.target);
    const pg = pageIds.has(s) ? s : (pageIds.has(t) ? t : null);
    const en = pg === s ? t : s;
    if (pg) { pageToEntities[pg] = pageToEntities[pg] || []; pageToEntities[pg].push(en); }
  });
  const coPairCount = {};
  Object.values(pageToEntities).forEach(ents => {
    for (let i = 0; i < ents.length; i++)
      for (let j = i+1; j < ents.length; j++) {
        const key = [ents[i],ents[j]].sort().join("|");
        coPairCount[key] = (coPairCount[key]||0) + 1;
      }
  });
  // For person-only networks or small archives, threshold=1 (any shared issue).
  // For mixed graphs with many issues, threshold=2 avoids near-complete graphs.
  const totalIssues = new Set(rawNodes.filter(n=>n.type==="page").map(n=>n.id)).size;
  const CO_THRESHOLD = (!hasPageNodes || totalIssues <= 3) ? 1 : 2;
  const coEdges = Object.entries(coPairCount)
    .filter(([,cnt]) => cnt >= CO_THRESHOLD)
    .map(([key]) => { const [a,b]=key.split("|"); return {source:a,target:b}; });

  // ── node size: 24-72px proportional to mention count ──
  function nodeSize(n) {
    const mc = mentionCount[n.id] || 0;
    const max = 2;
    return max <= 1 ? 32 : 24 + Math.round((mc / max) * 48);
  }

  // ── build Cytoscape elements ──
  let showPages = false;
  function buildElements(minM) {
    const vis = new Set(
      rawNodes.filter(n => n.type==="page" || (mentionCount[n.id]||0) >= minM).map(n => n.id)
    );
    const candidateIds = new Set(
      rawNodes.filter(n => vis.has(n.id) && (showPages || n.type !== "page")).map(n => n.id)
    );

    // Build edges first so we can filter out isolated nodes
    let edgeSource = showPages ? rawEdges : coEdges;
    const edges = edgeSource
      .filter(e => candidateIds.has(nodeId(e.source)) && candidateIds.has(nodeId(e.target)))
      .map((e,i) => ({ data:{ id:"e"+i, source:nodeId(e.source), target:nodeId(e.target) } }));

    // Only keep nodes that have at least one edge (isolated nodes add clutter, not insight)
    const connectedIds = new Set();
    edges.forEach(e => { connectedIds.add(e.data.source); connectedIds.add(e.data.target); });

    const nodes = rawNodes
      .filter(n => candidateIds.has(n.id) && connectedIds.has(n.id))
      .map(n => ({ data:{
        id: n.id, label: n.label || n.id, type: n.type,
        pages: (n.pages||[]).join(","),
        mentions: mentionCount[n.id]||0,
        size: nodeSize(n),
        snippets_uk: JSON.stringify(n.snippets_uk||{}),
        snippets_en: JSON.stringify(n.snippets_en||{}),
      } }));
    return [...nodes, ...edges];
  }

  function updateCount() {
    const n = cy.nodes().filter(n => n.data("type") !== "page").length;
    document.getElementById("node-count").textContent = "(" + n + " entities)";
  }

  // ── Cytoscape styles ──
  const STYLES = [
    { selector:"node[type='person']", style:{
        "background-color":"#3b82f6","border-color":"#1d4ed8","border-width":2,
        "width":"data(size)","height":"data(size)",
        "label":"data(label)","color":"#1e3a5f","font-size":13,"font-weight":600,
        "text-valign":"bottom","text-halign":"center","text-margin-y":5,
        "text-background-color":"#fff","text-background-opacity":1,
        "text-background-padding":"3px","text-background-shape":"roundrectangle",
        "text-max-width":"140px","text-wrap":"ellipsis",
    } },
    { selector:"node[type='location']", style:{
        "background-color":"#10b981","border-color":"#065f46","border-width":2,
        "width":"data(size)","height":"data(size)",
        "label":"data(label)","color":"#064e3b","font-size":13,"font-weight":600,
        "text-valign":"bottom","text-halign":"center","text-margin-y":5,
        "text-background-color":"#fff","text-background-opacity":1,
        "text-background-padding":"3px","text-background-shape":"roundrectangle",
        "text-max-width":"140px","text-wrap":"ellipsis",
    } },
    { selector:"node[type='page']", style:{
        "background-color":"#f59e0b","border-color":"#b45309","border-width":1.5,
        "width":22,"height":22,"shape":"rectangle",
        "label":"data(label)","color":"#78350f","font-size":10,
        "text-valign":"bottom","text-halign":"center","text-margin-y":4,
        "text-background-color":"#fff","text-background-opacity":1,
        "text-background-padding":"2px","text-background-shape":"roundrectangle",
        "text-max-width":"110px","text-wrap":"ellipsis",
    } },
    { selector:"node:selected", style:{
        "border-color":"#e11d48","border-width":4,"overlay-opacity":0,
    } },
    { selector:"node.dimmed", style:{"opacity":0.25} },
    { selector:"node.highlighted", style:{"border-color":"#e11d48","border-width":3} },
    { selector:"edge", style:{
        "line-color":"#cbd5e1","opacity":0.6,"width":1.5,
        "curve-style":"bezier","target-arrow-shape":"none",
    } },
    { selector:"edge.dimmed", style:{"opacity":0.12} },
    { selector:"edge.highlighted", style:{
        "line-color":"#e11d48","opacity":1,"width":2.5,
    } },
  ];

  // Row layout sorted by mentions — persons top, locations bottom.
  // Importance hierarchy comes from node size + opacity: most-mentioned nodes
  // are larger and fully opaque, lesser-mentioned fade slightly.
  function computePositions(nodeElements) {
    const W = document.getElementById("cy").clientWidth  || 1200;
    const PAD = 60;
    const usableW = W - PAD * 2;
    const pos = {};

    const byMentions = (a,b) => (b.data("mentions")||0) - (a.data("mentions")||0);
    const persons   = nodeElements.filter(n => n.data("type")==="person").sort(byMentions);
    const locations = nodeElements.filter(n => n.data("type")==="location").sort(byMentions);
    const pages     = nodeElements.filter(n => n.data("type")==="page");

    function itemWidth(n) {
      const sz = n.data("size") || 36;
      return Math.max(sz + 16, (n.data("label")||"").length * 7 + sz + 20);
    }
    function placeRow(list, y) {
      if (!list.length) return;
      const widths = list.map(itemWidth);
      const total  = widths.reduce((s,w)=>s+w, 0);
      const scale  = total > usableW ? usableW / total : 1;
      let x = PAD + (usableW - total*scale)/2 + widths[0]*scale/2;
      list.forEach((n,i) => {
        pos[n.data("id")] = {x, y};
        if (i < list.length-1) x += widths[i]*scale/2 + widths[i+1]*scale/2;
      });
    }
    function placeGroup(list, startY, rowH) {
      if (!list.length) return 0;
      const avgW = list.reduce((s,n)=>s+itemWidth(n),0)/list.length;
      const perRow = Math.max(1, Math.floor(usableW/avgW));
      let rows = [];
      for (let i=0; i<list.length; i+=perRow) rows.push(list.slice(i,i+perRow));
      rows.forEach((row,ri) => placeRow(row, startY + ri*rowH));
      return rows.length * rowH;
    }

    let y = PAD + 50;
    y += placeGroup(persons,   y, 110);
    if (persons.length && locations.length) y += 50;
    y += placeGroup(locations, y, 110);
    if (pages.length) {
      const pPerRow = Math.max(1, Math.floor(usableW/100));
      pages.forEach((n,i) => {
        pos[n.data("id")] = {
          x: PAD + (i%pPerRow+0.5)*(usableW/pPerRow),
          y: y + Math.floor(i/pPerRow)*50
        };
      });
    }
    return pos;
  }

  function runLayout(cy) {
    // Apply importance-scaled opacity BEFORE positioning
    const maxM = Math.max(1, ...cy.nodes().map(n => n.data("mentions")||0));
    cy.nodes().forEach(n => {
      const ratio = (n.data("mentions")||1) / maxM;
      // opacity: 0.45 for min-mentioned → 1.0 for max-mentioned
      n.style("opacity", 0.45 + ratio * 0.55);
    });

    const pos = computePositions(cy.nodes().toArray());
    cy.nodes().forEach(n => { if (pos[n.data("id")]) n.position(pos[n.data("id")]); });
    cy.fit(cy.elements(), 60);
  }

  // For person-only networks (no page nodes), use edge-degree as mention count
  if (!hasPageNodes) {
    rawNodes.forEach(n => {
      const deg = rawEdges.filter(e => e.source === n.id || e.target === n.id).length;
      mentionCount[n.id] = deg;
    });
  }

  const initMin = hasPageNodes ? 1 : 0;
  const cy = cytoscape({
    container: document.getElementById("cy"),
    elements: buildElements(initMin),
    style: STYLES,
    layout: {name:"preset"},
    userZoomingEnabled:true, userPanningEnabled:true, boxSelectionEnabled:false,
  });

  // Apply positions after Cytoscape finishes mounting
  requestAnimationFrame(() => { cy.resize(); runLayout(cy); });

  document.getElementById("loading").style.display = "none";
  updateCount();

  // ── search ──
  document.getElementById("search").addEventListener("input", function() {
    const q = this.value.trim().toLowerCase();
    if (!q) { cy.elements().removeClass("dimmed highlighted"); return; }
    cy.elements().addClass("dimmed");
    cy.nodes().filter(n => n.data("label").toLowerCase().includes(q))
      .removeClass("dimmed").addClass("highlighted")
      .neighborhood().removeClass("dimmed");
  });

  // ── min-mentions slider ──
  const slider = document.getElementById("min-mentions");
  slider.addEventListener("input", function() {
    const min = parseInt(this.value);
    document.getElementById("filter-val").textContent = min;
    cy.elements().remove();
    cy.add(buildElements(min));
    runLayout(cy);
    resetDetail();
    updateCount();
  });

  // ── toggle issue nodes ──
  document.getElementById("toggle-pages").addEventListener("click", function() {
    showPages = !showPages;
    this.classList.toggle("active", showPages);
    document.getElementById("legend-page").parentElement.style.opacity = showPages ? "1" : "0.3";
    const min = parseInt(slider.value);
    cy.elements().remove();
    cy.add(buildElements(min));
    runLayout(cy);
    resetDetail();
    updateCount();
  });

  // ── hover highlight (never clears a tap-locked selection) ──
  let tappedNode = null;
  cy.on("mouseover", "node", function(e) {
    if (tappedNode) return;
    // Highlight only — do NOT dim anything. Dimming makes the graph look empty.
    e.target.connectedEdges().addClass("highlighted");
    e.target.addClass("highlighted");
    cy.container().style.cursor = "pointer";
  });
  cy.on("mouseout", "node", function() {
    if (tappedNode) return;
    cy.elements().removeClass("highlighted");
    cy.container().style.cursor = "";
  });

  // ── helpers ──
  function resetDetail() {
    document.getElementById("detail").innerHTML = "<p class='hint'>Click any node<br>to see details.</p>";
  }

  function formatPageId(pid) {
    const mo = ["","January","February","March","April","May","June",
                "July","August","September","October","November","December"];
    const m = pid.match(/([a-z]+)_([0-9]{4})([0-9]{2})([0-9]{2})_([^_]+)(?:_page([0-9]+))?/i);
    if (!m) return pid;
    const paper = m[1].charAt(0).toUpperCase()+m[1].slice(1);
    const mon = mo[parseInt(m[3],10)]||m[3];
    const iss = m[5].replace(/^no/i,"No. ");
    const pg  = m[6] ? ", p. "+parseInt(m[6],10) : "";
    return paper+", "+parseInt(m[4],10)+" "+mon+" "+m[2]+", "+iss+pg;
  }

  // ── click: detail panel + lock highlight ──
  cy.on("tap", "node", function(e) {
    tappedNode = e.target;
    // On click: clear any hover-dimming, then highlight this node and its edges only.
    // We deliberately do NOT dim other nodes — dimming makes the graph appear to vanish.
    cy.elements().removeClass("dimmed highlighted");
    e.target.connectedEdges().addClass("highlighted");
    e.target.addClass("highlighted");
    const d = e.target.data();
    const badgeClass = "badge badge-" + d.type;
    const typeLabel  = d.type === "page" ? "Issue" : d.type.charAt(0).toUpperCase()+d.type.slice(1);

    let body = "";
    if (d.type === "page") {
      const ents = e.target.neighborhood("node")
        .map(n => `<li>${n.data("label")} <span style="color:#aaa;font-size:.7rem">[${n.data("type")}]</span></li>`)
        .join("");
      body = `<div class="field"><b>Entities mentioned</b><ul>${ents||"<li>—</li>"}</ul></div>`;
    } else {
      const snUk = JSON.parse(d.snippets_uk||"{}");
      const snEn = JSON.parse(d.snippets_en||"{}");
      const pages = d.pages ? d.pages.split(",").filter(Boolean) : [];

      const items = pages.map(p => {
        const cite    = formatPageId(p);
        const issueId = p.includes("_page") ? p.substring(0,p.lastIndexOf("_page")) : p;
        const url     = SITE_BASE ? SITE_BASE+"issues/"+issueId+"/" : "";
        const link    = url
          ? `<a href="${url}" target="_blank">📰 ${cite} ↗</a>`
          : `<span style="font-weight:600">${cite}</span>`;
        const uk = snUk[p] ? `<div class="snippet uk">🇺🇦 "${snUk[p]}"</div>` : "";
        const en = snEn[p] ? `<div class="snippet en">🇬🇧 "${snEn[p]}"</div>` : "";
        return `<li>${link}${uk}${en}</li>`;
      }).join("")||"<li>—</li>";

      const connectedTo = e.target.neighborhood("node")
        .filter(n => n.data("type") !== "page")
        .map(n => `<li>${n.data("label")}</li>`).join("");

      body = `
        <div class="field"><b>Mentioned in</b><ul>${items}</ul></div>
        ${connectedTo ? `<div class="field"><b>Co-occurs with</b><ul>${connectedTo}</ul></div>` : ""}
      `;
    }

    document.getElementById("detail").innerHTML = `
      <h3>${d.label}</h3>
      <span class="${badgeClass}">${typeLabel}</span>
      ${d.mentions ? `<div style="font-size:.72rem;color:#888;margin-bottom:8px">${d.mentions} mention${d.mentions>1?"s":""}</div>` : ""}
      ${body}`;
  });

  cy.on("tap", function(e) {
    if (e.target === cy) {
      tappedNode = null;
      resetDetail();
      cy.elements().removeClass("dimmed highlighted");
    }
  });
  </script>
