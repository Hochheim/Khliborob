                               pages: (n.pages||[]).join(", "),
                               omeka_url: n.omeka_url||"",
                               mentions: mentionCount[n.id]||0,
                               snippets_uk: JSON.stringify(n.snippets_uk||{}),
                               snippets_en: JSON.stringify(n.snippets_en||{}),
                               omeka_urls: JSON.stringify(n.omeka_urls||{}) } }));
      const edges = rawEdges
        .filter(e => visibleNodeIds.has(nodeId(e.source)) && visibleNodeIds.has(nodeId(e.target)))
        .map((e,i) => ({ data: { id:"e"+i,
                                   source: nodeId(e.source),
                                   target: nodeId(e.target),
                                   label: e.label } }));
      return [...nodes, ...edges];
    }

    function updateCount(min) {
      const visible = rawNodes.filter(n => n.type !== "page" && (mentionCount[n.id]||0) >= min).length;
      document.getElementById("node-count").textContent =
        `(${visible} entities visible)`;
    }

    const cy = cytoscape({
      container: document.getElementById("cy"),
      elements: buildElements(1),
      style: [
        { selector: "node[type='page']",
           style: { "background-color":"#e94560","border-color":"#fff","border-width":2,
                     "width":28,"height":28,"label":"data(label)",
                     "color":"#eee","font-size":10,"text-valign":"bottom","text-margin-y":4 } },
        { selector: "node[type='person']",
           style: { "background-color":"#4a90d9","border-color":"#e94560","border-width":1.5,
                     "width":18,"height":18,"label":"data(label)",
                     "color":"#eee","font-size":8,"text-valign":"bottom","text-margin-y":3 } },
        { selector: "node[type='location']",
           style: { "background-color":"#7c53b8","border-color":"#e94560","border-width":1.5,
                     "width":18,"height":18,"label":"data(label)",
                     "color":"#eee","font-size":8,"text-valign":"bottom","text-margin-y":3 } },
        { selector: "node:selected",
           style: { "border-color":"#fff","border-width":3,"overlay-opacity":0.15 } },
        { selector: "edge",
           style: { "line-color":"#444","opacity":0.6,"width":1.2,
                     "curve-style":"bezier","target-arrow-shape":"none" } },
      ],
      layout: { name:"cose", animate:false, padding:40,
                  nodeRepulsion:6000, idealEdgeLength:100,
                  gravity:0.2, numIter:500 },
      userZoomingEnabled: true,
      userPanningEnabled: true,
      boxSelectionEnabled: false,
    });

    // Initialise count display
    updateCount(1);

    // Slider: filter nodes by minimum page-mention count
    const slider = document.getElementById("min-mentions");
    slider.addEventListener("input", function() {
      const min = parseInt(this.value);
      document.getElementById("filter-val").textContent = min;
      updateCount(min);
      cy.elements().remove();
      cy.add(buildElements(min));
      cy.layout({ name:"cose", animate:true, animationDuration:400,
                   padding:40, nodeRepulsion:6000,
                   idealEdgeLength:100, gravity:0.2, numIter:300 }).run();
      document.getElementById("detail").innerHTML =
        "<p class='hint'>Click any node to see details.</p>";
    });

    cy.on("tap", "node", function(e) {
      const d   = e.target.data();
      let body = "";
      // Format a raw page_id into a readable citation
      // e.g. bukovina_19811201_no4_page01 → "Bukovina, 1 December 1981, No. 4, Page 1"
      function formatPageId(pid) {
        var months = ["","January","February","March","April","May","June",
                      "July","August","September","October","November","December"];
        var m = pid.match(/([a-z]+)_([0-9][0-9][0-9][0-9])([0-9][0-9])([0-9][0-9])_([^_]+)_page([0-9]+)/i);
        if (!m) return pid;
        var paper = m[1].charAt(0).toUpperCase() + m[1].slice(1);
        var mon   = months[parseInt(m[3], 10)] || m[3];
        var issue = m[5].replace(/^no/i, "No. ").replace(/^ch/i, "Ch. ");
        return paper + ", " + parseInt(m[4], 10) + " " + mon + " " + m[2] + ", " + issue + ", Page " + parseInt(m[6], 10);
      }

      if (d.type === "page") {
        const entities = e.target.neighborhood("node")
          .map(n => `<li>${n.data("label")} <span style="color:#888;font-size:0.7rem">[${n.data("type")}]</span></li>`)
          .join("");
        body = `<div class="field"><b>Entities mentioned</b>
                  <ul>${entities || "<li>—</li>"}</ul></div>`;
      } else {
        const snUk = JSON.parse(d.snippets_uk || "{}");
        const snEn = JSON.parse(d.snippets_en || "{}");
        const pages = d.pages ? d.pages.split(", ") : [];

        const pageItems = pages.map(p => {
          const cite = formatPageId(p);
          const issueId = p.includes("_page") ? p.substring(0, p.lastIndexOf("_page")) : p;
          const url = SITE_BASE ? SITE_BASE + "issues/" + issueId + "/" : "";
          const link = url
            ? `<a href="${url}" target="_blank"
                  style="color:#e94560;text-decoration:none;font-size:0.78rem">
                ${cite} ↗</a>`
            : `<b style="font-size:0.78rem">${cite}</b>`;
          const uk = snUk[p] ? `<div style="background:#0a0a1a;border-left:3px solid #e94560;
                                  padding:5px 8px;margin:4px 0;font-size:0.74rem;
                                  font-style:italic;color:#bbb">🇺🇦 "${snUk[p]}"</div>` : "";
          const en = snEn[p] ? `<div style="background:#0a0a1a;border-left:3px solid #4a90d9;
                                  padding:5px 8px;margin:4px 0;font-size:0.74rem;
                                  font-style:italic;color:#bbb">🇬🇧 "${snEn[p]}"</div>` : "";
          return `<li style="margin-bottom:10px;list-style:none">
                    ${link}${uk}${en}
                  </li>`;
        }).join("") || "<li>—</li>";

        body = `<div class="field"><b>Cited in</b><ul style="padding:0">${pageItems}</ul></div>`;
      }
      document.getElementById("detail").innerHTML = `
        <h3>${d.label}</h3>
        <span class="badge">${d.type}</span>
        ${body}`;
    });

    cy.on("tap", function(e) {
      if (e.target === cy) {
        document.getElementById("detail").innerHTML =
          "<p class='hint'>Click any node to see details.</p>";
      }
    });
  </script>
</body>
</html>
