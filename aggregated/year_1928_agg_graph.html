  function nodeId(x) { return (x && typeof x === "object") ? x.id : String(x); }

  // ── mention counts ──
  // Graphs come in two shapes: page-based (edges run page→entity, and
  // entity-entity links are derived from co-occurrence on shared pages)
  // and direct (edges already run entity→entity, e.g. the person
  // co-mention network, which has no page nodes at all). In direct mode
  // the co-occurrence derivation would find nothing and blank the graph,
  // so edges are used as-is and "mentions" means node degree.
  const pageIds = new Set(rawNodes.filter(n => n.type === "page").map(n => n.id));
  const hasPageNodes = rawNodes.some(n => n.type === "page");
  const directMode = !hasPageNodes;
  const mentionCount = {};
  if (directMode) {
    // "Mentions" means how many issues/pages reference the entity. Edge
    // degree is useless here: in a co-mention graph everyone in the same
    // issue links to everyone else, so every node would show the same
    // near-total count.
    rawNodes.forEach(n => { mentionCount[n.id] = (n.pages && n.pages.length) || 0; });
    if (!Object.values(mentionCount).some(v => v > 0)) {
      rawEdges.forEach(e => {
        const s = nodeId(e.source), t = nodeId(e.target);
        mentionCount[s] = (mentionCount[s]||0)+1;
        mentionCount[t] = (mentionCount[t]||0)+1;
      });
    }
  } else {
    rawEdges.forEach(e => {
      const s = nodeId(e.source), t = nodeId(e.target);
      if (pageIds.has(s)) mentionCount[t] = (mentionCount[t]||0)+1;
      if (pageIds.has(t)) mentionCount[s] = (mentionCount[s]||0)+1;
    });
  }

  // ── co-occurrence edges: only pairs that share 2+ pages ──
  // Counting ALL co-occurrences per page produces a near-complete graph
  // (N entities → N*(N-1)/2 edges), making the map unreadable.
  // We keep only pairs that are co-mentioned across at least 2 separate pages.
  const pageToEntities = {};
  rawEdges.forEach(e => {
    const s = nodeId(e.source), t = nodeId(e.target);
    const pg = pageIds.has(s) ? s : (pageIds.has(t) ? t : null);
    const en = pg === s ? t : s;
    if (pg) { pageToEntities[pg] = pageToEntities[pg] || []; pageToEntities[pg].push(en); }
  });
  const coPairCount = {};
  Object.values(pageToEntities).forEach(ents => {
    for (let i = 0; i < ents.length; i++)

  const CO_THRESHOLD = (!hasPageNodes || totalIssues <= 3) ? 1 : 2;

    ? rawEdges.map(e => ({source: nodeId(e.source), target: nodeId(e.target)}))
    : Object.entries(coPairCount)

    return [...nodes, ...edges];

  // that division rounded down to 1 item per row, stacking every node in a
  // single vertical column regardless of the real co-mention edges (which
  // were computed correctly all along — they just rendered as invisible
  // segments directly behind the column). cose instead positions nodes by
  // their actual edge structure, so related people cluster together and
  // edge presence is finally visible, and it degrades gracefully at any
  // panel size since it isn't driven by container width at all.
  function runLayout(cy) {
    const maxM = Math.max(1, ...cy.nodes().map(n => n.data("mentions")||0));
    cy.nodes().forEach(n => {
      const ratio = (n.data("mentions")||1) / maxM;
      // opacity: 0.45 for min-mentioned → 1.0 for max-mentioned
      n.style("opacity", 0.45 + ratio * 0.55);

      name: "cose",
      animate: false,
      randomize: true,
      nodeOverlap: 24,
      idealEdgeLength: () => 90,
      nodeRepulsion: () => 12000,
      gravity: 25,
      numIter: 1500,
      fit: true,

    if (!document.hidden) {
      const p = cy.nodes().length ? cy.nodes()[0].position() : null;
      if (p && p.x === 0 && p.y === 0) kickoffLayout();
    }
  });

  document.getElementById("loading").style.display = "none";
  updateCount();

  // ── search ──
  document.getElementById("search").addEventListener("input", function() {
    const q = this.value.trim().toLowerCase();
    if (!q) { cy.elements().removeClass("dimmed highlighted"); return; }
    cy.elements().addClass("dimmed");
    cy.nodes().filter(n => n.data("label").toLowerCase().includes(q))
      .removeClass("dimmed").addClass("highlighted")
      .neighborhood().removeClass("dimmed");
  });

  // ── min-mentions slider ──
  const slider = document.getElementById("min-mentions");
  slider.addEventListener("input", function() {
    const min = parseInt(this.value);
    document.getElementById("filter-val").textContent = min;
    cy.elements().remove();
    cy.add(buildElements(min));
    runLayout(cy);
    resetDetail();
    updateCount();
  });

  // ── toggle issue nodes ──
  document.getElementById("toggle-pages").addEventListener("click", function() {
    showPages = !showPages;
    this.classList.toggle("active", showPages);
    document.getElementById("legend-page").parentElement.style.opacity = showPages ? "1" : "0.3";
    const min = parseInt(slider.value);
    cy.elements().remove();
    cy.add(buildElements(min));
    runLayout(cy);
    resetDetail();
    updateCount();
  });

  // ── hover highlight (never clears a tap-locked selection) ──
  let tappedNode = null;
  cy.on("mouseover", "node", function(e) {
    if (tappedNode) return;
    // Highlight only — do NOT dim anything. Dimming makes the graph look empty.
    e.target.connectedEdges().addClass("highlighted");
    e.target.addClass("highlighted");
    cy.container().style.cursor = "pointer";
  });
  cy.on("mouseout", "node", function() {
    if (tappedNode) return;
    cy.elements().removeClass("highlighted");
    cy.container().style.cursor = "";
  });

  // ── helpers ──
  let detailLang = "en";
  let detailNode = null;

  function resetDetail() {
    detailNode = null;
    document.getElementById("detail-body").innerHTML = "<p class='hint'>Click any node<br>to see details.</p>";
  }

  function setDetailLang(lang) {
    detailLang = lang;
    document.querySelectorAll(".dlang-btn").forEach(b => b.classList.toggle("active", b.dataset.dlang===lang));
    if (detailNode) renderDetail(detailNode);
  }

  function formatPageId(pid) {
    const mo = ["","January","February","March","April","May","June",
                "July","August","September","October","November","December"];
    const m = pid.match(/([a-z]+)_([0-9]{4})([0-9]{2})([0-9]{2})_([^_]+)(?:_page([0-9]+))?/i);
    if (!m) return pid;
    const paper = m[1].charAt(0).toUpperCase()+m[1].slice(1);
    const mon = mo[parseInt(m[3],10)]||m[3];
    const iss = m[5].replace(/^no/i,"No. ");
    const pg  = m[6] ? ", p. "+parseInt(m[6],10) : "";
    return paper+", "+parseInt(m[4],10)+" "+mon+" "+m[2]+", "+iss+pg;
  }

  // ── click: detail panel + lock highlight ──
  function renderDetail(node) {
    const d = node.data();
    const badgeClass = "badge badge-" + d.type;
    const typeLabel  = d.type === "page" ? "Issue" : d.type.charAt(0).toUpperCase()+d.type.slice(1);

    let body = "";
    if (d.type === "page") {
      const ents = node.neighborhood("node")
        .map(n => `<li>${n.data("label")} <span style="color:#aaa;font-size:.7rem">[${n.data("type")}]</span></li>`)
        .join("");
      body = `<div class="field"><b>Entities mentioned</b><ul>${ents||"<li>—</li>"}</ul></div>`;
    } else {
      const snips = {
        en: JSON.parse(d.snippets_en||"{}"), uk: JSON.parse(d.snippets_uk||"{}"),
        pt: JSON.parse(d.snippets_pt||"{}"), de: JSON.parse(d.snippets_de||"{}"),
      };
      const pageParaMap = JSON.parse(d.page_para||"{}");
      const flags = {en:"🇬🇧",uk:"🇺🇦",pt:"🇧🇷",de:"🇩🇪"};
      const fallbackOrder = ["en","uk","pt","de"];
      const pages = d.pages ? d.pages.split(",").filter(Boolean) : [];

      const items = pages.map(p => {
        const cite    = formatPageId(p);
        const issueId = p.includes("_page") ? p.substring(0,p.lastIndexOf("_page")) : p;
        const paraIdx = pageParaMap[p];
        // A snippet in the requested language isn't always found (e.g. no
        // literal match in that translation) — fall back to whichever
        // language does have one, but label/link it honestly rather than
        // showing e.g. English text under a German flag.
        const shownLang = snips[detailLang][p] ? detailLang
          : fallbackOrder.find(l => snips[l][p]) || detailLang;
        const anchor = (paraIdx !== undefined && paraIdx !== null) ? ("#para-uk-" + p + "-" + paraIdx) : "";
        const url = SITE_BASE ? SITE_BASE+"issues/"+issueId+"/"+anchor : "";
        const link = url
          ? `<a href="${url}" target="_blank">📰 ${cite} ↗</a>`
          : `<span style="font-weight:600">${cite}</span>`;
        const text = snips[shownLang][p];
        const snip = text ? `<div class="snippet ${shownLang}">${flags[shownLang]} "${text}"</div>` : "";
        return `<li>${link}${snip}</li>`;
      }).join("")||"<li>—</li>";

      const connectedTo = node.neighborhood("node")
        .filter(n => n.data("type") !== "page")
        .map(n => `<li>${n.data("label")}</li>`).join("");

      body = `
        <div class="field"><b>Mentioned in</b><ul>${items}</ul></div>
        ${connectedTo ? `<div class="field"><b>Co-occurs with</b><ul>${connectedTo}</ul></div>` : ""}
      `;
    }

    document.getElementById("detail-body").innerHTML = `
      <h3>${d.label}</h3>
      <span class="${badgeClass}">${typeLabel}</span>
      ${d.mentions ? `<div style="font-size:.72rem;color:#888;margin-bottom:8px">${d.mentions} mention${d.mentions>1?"s":""}</div>` : ""}
      ${body}`;
  }

  cy.on("tap", "node", function(e) {
    tappedNode = e.target;
    detailNode = e.target;
    // On click: clear any hover-dimming, then highlight this node and its edges only.
    // We deliberately do NOT dim other nodes — dimming makes the graph appear to vanish.
    cy.elements().removeClass("dimmed highlighted");
    e.target.connectedEdges().addClass("highlighted");
    e.target.addClass("highlighted");
    renderDetail(e.target);
  });

  cy.on("tap", function(e) {
    if (e.target === cy) {
      tappedNode = null;
      resetDetail();
      cy.elements().removeClass("dimmed highlighted");
    }
  });
  </script>
</body>
</html>
